<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Robinhood Chain 一键发币</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script src="https://binaries.soliditylang.org/bin/soljson-v0.8.24+commit.e11b9ed9.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f5f8;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    font-size: 25px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 14px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    margin-top: 14px;
    background: #0052ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.deploy {
    background: #00a86b;
}

.info {
    background: #f5f7fa;
    padding: 13px;
    border-radius: 9px;
    margin: 15px 0;
    font-size: 13px;
    word-break: break-all;
}

.status {
    display: none;
    padding: 14px;
    margin-top: 18px;
    border-radius: 9px;
    line-height: 1.7;
    word-break: break-all;
    font-size: 13px;
}

.success {
    display: block;
    background: #e5f8ec;
    color: #16753a;
}

.error {
    display: block;
    background: #ffeaea;
    color: #c62828;
}

.loading {
    display: block;
    background: #e8f0ff;
    color: #0052ff;
}

a {
    color: #0052ff;
    word-break: break-all;
}

.note {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

<h1>🚀 一键发币</h1>

<p class="subtitle">
Robinhood Chain ERC-20 Token Creator
</p>

<div class="info">
钱包：<span id="wallet">未连接</span>
<br><br>
网络：<span id="network">未连接</span>
</div>

<label>代币名称</label>
<input id="tokenName" value="Robinhood Token">

<label>代币符号</label>
<input id="tokenSymbol" value="RHT">

<label>发行总量</label>
<input id="totalSupply" type="number"
value="1000000" min="1" step="1">

<button id="connectBtn" onclick="connectWallet()">
连接钱包
</button>

<button id="deployBtn" class="deploy"
onclick="deployToken()" disabled>
部署 ERC-20 代币
</button>

<div id="status" class="status"></div>

<p class="note">
⚠️ 请确保钱包有足够 ETH 支付 Gas 费用
<br>
请先在测试网上验证，再使用主网
</p>

</div>

<script>

const CHAIN_ID = "0x1237";

const NETWORK = {
    chainId: CHAIN_ID,
    chainName: "Robinhood Chain",
    nativeCurrency: {
        name: "Ether",
        symbol: "ETH",
        decimals: 18
    },
    rpcUrls: [
        "https://rpc.mainnet.chain.robinhood.com"
    ],
    blockExplorerUrls: [
        "https://robinhoodchain.blockscout.com"
    ]
};

let provider;
let signer;
let userAddress;
let busy = false;

const statusBox = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");
const deployBtn = document.getElementById("deployBtn");

function status(message, type = "loading") {
    statusBox.className = "status " + type;
    statusBox.textContent = message;
}

async function connectWallet() {

    if (!window.ethereum) {
        status("未检测到 MetaMask 或兼容钱包", "error");
        return;
    }

    try {

        status("正在连接钱包...");

        await window.ethereum.request({
            method: "eth_requestAccounts"
        });

        const chain = await window.ethereum.request({
            method: "eth_chainId"
        });

        if (chain !== CHAIN_ID) {

            try {

                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{
                        chainId: CHAIN_ID
                    }]
                });

            } catch (e) {

                if (e.code === 4902) {

                    await window.ethereum.request({
                        method: "wallet_addEthereumChain",
                        params: [NETWORK]
                    });

                } else {
                    throw e;
                }
            }
        }

        provider = new ethers.providers.Web3Provider(
            window.ethereum
        );

        signer = provider.getSigner();

        userAddress = await signer.getAddress();

        const currentNetwork = await provider.getNetwork();

        if (currentNetwork.chainId !== 4663) {
            throw new Error("网络验证失败");
        }

        document.getElementById("wallet").textContent =
            userAddress;

        document.getElementById("network").textContent =
            "Robinhood Chain ✓";

        connectBtn.textContent = "钱包已连接";

        deployBtn.disabled = false;

        status("钱包连接成功，可以开始创建代币", "success");

    } catch (e) {

        status("连接失败：" + e.message, "error");

    }
}


// ERC20 智能合约源码
const TOKEN_SOURCE = `
// SPDX-License-Identifier: MIT
pragma solidity ^0.8.24;

contract MyToken {

    string public name;
    string public symbol;

    uint8 public constant decimals = 18;

    uint256 public totalSupply;

    mapping(address => uint256) public balanceOf;

    mapping(address => mapping(address => uint256))
        public allowance;

    event Transfer(
        address indexed from,
        address indexed to,
        uint256 value
    );

    event Approval(
        address indexed owner,
        address indexed spender,
        uint256 value
    );

    constructor(
        string memory name_,
        string memory symbol_,
        uint256 supply_
    ) {

        require(bytes(name_).length > 0, "Empty name");
        require(bytes(symbol_).length > 0, "Empty symbol");
        require(supply_ > 0, "Zero supply");

        name = name_;
        symbol = symbol_;

        uint256 amount = supply_ * 10 ** uint256(decimals);

        totalSupply = amount;
        balanceOf[msg.sender] = amount;

        emit Transfer(address(0), msg.sender, amount);
    }

    function transfer(
        address to,
        uint256 amount
    ) public returns (bool) {

        require(to != address(0), "Zero address");
        require(balanceOf[msg.sender] >= amount, "Balance low");

        balanceOf[msg.sender] -= amount;
        balanceOf[to] += amount;

        emit Transfer(msg.sender, to, amount);

        return true;
    }

    function approve(
        address spender,
        uint256 amount
    ) public returns (bool) {

        require(spender != address(0), "Zero address");

        allowance[msg.sender][spender] = amount;

        emit Approval(msg.sender, spender, amount);

        return true;
    }

    function transferFrom(
        address from,
        address to,
        uint256 amount
    ) public returns (bool) {

        require(to != address(0), "Zero address");
        require(balanceOf[from] >= amount, "Balance low");
        require(allowance[from][msg.sender] >= amount, "Allowance low");

        allowance[from][msg.sender] -= amount;
        balanceOf[from] -= amount;
        balanceOf[to] += amount;

        emit Transfer(from, to, amount);

        return true;
    }
}
`;


// 浏览器编译 Solidity
function compileContract() {

    if (!window.Module || typeof Module.cwrap !== "function") {
        throw new Error("Solidity 编译器尚未加载，请刷新页面");
    }

    const compile = Module.cwrap(
        "solidity_compile",
        "string",
        ["string", "number", "number"]
    );

    const input = {

        language: "Solidity",

        sources: {
            "MyToken.sol": {
                content: TOKEN_SOURCE
            }
        },

        settings: {

            optimizer: {
                enabled: true,
                runs: 200
            },

            outputSelection: {
                "*": {
                    "*": [
                        "abi",
                        "evm.bytecode.object"
                    ]
                }
            }
        }
    };

    const output = JSON.parse(
        compile(JSON.stringify(input), 0, 0)
    );

    if (output.errors) {

        const errors = output.errors.filter(
            x => x.severity === "error"
        );

        if (errors.length) {
            throw new Error(
                errors.map(x => x.formattedMessage).join("\n")
            );
        }
    }

    const artifact = output.contracts?.["MyToken.sol"]?.MyToken;

    if (!artifact || !artifact.evm.bytecode.object) {
        throw new Error("合约编译失败，未生成部署字节码");
    }

    return {
        abi: artifact.abi,
        bytecode: "0x" + artifact.evm.bytecode.object
    };
}


// 部署代币
async function deployToken() {

    if (busy) return;

    if (!signer) {
        status("请先连接钱包", "error");
        return;
    }

    busy = true;
    deployBtn.disabled = true;
    connectBtn.disabled = true;

    try {

        const name = document.getElementById("tokenName")
            .value.trim();

        const symbol = document.getElementById("tokenSymbol")
            .value.trim();

        const supply = document.getElementById("totalSupply")
            .value.trim();

        if (!name || !symbol) {
            throw new Error("请填写代币名称和符号");
        }

        if (!/^[1-9][0-9]*$/.test(supply)) {
            throw new Error("发行量必须为正整数");
        }

        if (supply.length > 30) {
            throw new Error("发行量过大");
        }

        const currentNetwork = await provider.getNetwork();

        if (currentNetwork.chainId !== 4663) {
            throw new Error("请切换到 Robinhood Chain");
        }

        status("正在编译 ERC-20 智能合约...");

        const artifact = compileContract();

        status("编译成功，正在估算 Gas...");

        const factory = new ethers.ContractFactory(
            artifact.abi,
            artifact.bytecode,
            signer
        );

        const args = [
            name,
            symbol,
            supply
        ];

        const estimatedGas = await factory.signer.estimateGas(
            await factory.getDeployTransaction(...args)
        );

        const gasLimit = estimatedGas.mul(120).div(100);

        status(
            "Gas 估算完成。\n预计 Gas Limit：" +
            gasLimit.toString() +
            "\n请在钱包中确认部署交易..."
        );

        const contract = await factory.deploy(
            ...args,
            {
                gasLimit: gasLimit
            }
        );

        status(
            "交易已经发送！\n交易 Hash：\n" +
            contract.deployTransaction.hash +
            "\n正在等待区块确认..."
        );

        const receipt = await contract.deployTransaction.wait(1);

        if (receipt.status !== 1) {
            throw new Error("链上交易执行失败");
        }

        const code = await provider.getCode(contract.address);

        if (code === "0x") {
            throw new Error("部署交易已确认，但未检测到合约代码");
        }

        const explorer =
            NETWORK.blockExplorerUrls[0];

        statusBox.className = "status success";

        statusBox.innerHTML = `
            <h3>🎉 代币部署成功！</h3>

            <br>

            <b>代币名称：</b>${escapeHTML(name)}

            <br><br>

            <b>代币符号：</b>${escapeHTML(symbol)}

            <br><br>

            <b>发行总量：</b>${escapeHTML(supply)}

            <br><br>

            <b>合约地址：</b>

            <br>

            <span id="contractAddress"></span>

            <br><br>

            <b>交易 Hash：</b>

            <br>

            <span id="txHash"></span>

            <br><br>

            <a id="explorerLink" target="_blank"
               rel="noopener noreferrer">
               在区块浏览器查看合约
            </a>
        `;

        document.getElementById("contractAddress").textContent =
            contract.address;

        document.getElementById("txHash").textContent =
            contract.deployTransaction.hash;

        document.getElementById("explorerLink").href =
            explorer + "/address/" + contract.address;

    } catch (e) {

        console.error(e);

        status(
            "部署失败：" + (e.reason || e.message || "未知错误"),
            "error"
        );

    } finally {

        busy = false;
        deployBtn.disabled = !signer;
        connectBtn.disabled = false;

    }
}


function escapeHTML(value) {
    return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}


// 钱包账户变化
if (window.ethereum) {

    window.ethereum.on("accountsChanged", () => {
        window.location.reload();
    });

    window.ethereum.on("chainChanged", () => {
        window.location.reload();
    });

}

</script>

</body>
</html>
