<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solana Token‑2022 一键发币</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.2/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.4.9/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/spl-token-metadata@0.1.6/lib/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/wallet-standard-browser@1.1.0/dist/index.iife.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#0E101A;color:#eee;padding:24px 16px;min-height:100vh}
.container{max-width:580px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.title{font-size:26px;font-weight:700}
.network-tag{background:#1f243b;padding:6px 12px;border-radius:8px;font-size:14px;color:#73c9ff}
.card{background:#171a2c;border-radius:16px;padding:24px;margin-bottom:18px;border:1px solid #292d44}
.form-item{margin-bottom:18px}
label{display:block;margin-bottom:6px;color:#c2c8e8;font-size:15px}
input{width:100%;padding:13px 14px;border-radius:10px;background:#0f1222;border:1px solid #333854;color:#fff;font-size:15px}
input:focus{outline:none;border-color:#4988ff}
.check-row{display:flex;gap:8px;align-items:center}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-connect{background:#2563eb;color:#fff}
.btn-go{background:#22c55e;color:#000}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.log-box{margin-top:16px;padding:14px;background:#0f1222;border-radius:10px;max-height:260px;overflow:auto;font-size:13px;white-space:pre-wrap;color:#b8c2e8}
a{color:#4990ff}
.tip{font-size:13px;color:#888fb8;margin-top:4px}
.step{margin-bottom:20px;color:#b4bce0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="title">🚀 Token‑2022 一键发币</div>
<div class="network-tag" id="netText">Mainnet 主网</div>
</div>

<div class="step">
1.连接钱包（支持 Phantom / Backpack / Solflare ）私钥本地，不上传服务器<br>
2.填写代币参数<br>
3.模拟交易并签名<br>
4.获取Mint地址，Solscan查看代币
</div>

<div class="card">
<button id="connectWalletBtn" class="btn btn-connect">连接钱包</button>
<div id="walletInfo" style="margin:12px 0;color:#8ee0ff"></div>

<div class="form-item">
<label>代币名称 Name</label>
<input id="tkName" placeholder="例如 MyCoin">
</div>

<div class="form-item">
<label>代币符号 Symbol</label>
<input id="tkSymbol" placeholder="例如 MYC">
</div>

<div class="form-item">
<label>小数位数 Decimals（Token‑2022建议9）</label>
<input id="tkDecimals" value="9" type="number">
</div>

<div class="form-item">
<label>初始总供应量（不带小数）</label>
<input id="tkSupply" placeholder="例如 1000000000">
<div class="tip">程序内部自动乘以10^decimals</div>
</div>

<div class="form-item check-row">
<input type="checkbox" id="revokeMint">
<label for="revokeMint">部署后撤销铸造权限（总量固定）</label>
</div>

<div class="form-item check-row">
<input type="checkbox" id="revokeFreeze">
<label for="revokeFreeze">部署后撤销账户冻结权限</label>
</div>

<button id="deployBtn" class="btn btn-go" disabled>🚀 创建Token‑2022代币</button>

<div class="log-box" id="logBox"></div>
</div>

</div>

<script>
const {Connection,clusterApiUrl,Keypair,LAMPORTS_PER_SOL,PublicKey}=solanaWeb3;
const {TOKEN_2022_PROGRAM_ID,createMint,createMintToInstruction,getAssociatedTokenAddress,createAssociatedTokenAccountInstruction}=solanaSplToken;
const {createInitializeInstruction}=solanaSplTokenMetadata;
const {getWallets}=window['@solana/wallet-standard-browser'];

let connection=null;
let selectedWallet=null;
let userPubKey=null;
const logBox=document.getElementById("logBox");
const connectBtn=document.getElementById("connectWalletBtn");
const deployBtn=document.getElementById("deployBtn");
const walletInfoDom=document.getElementById("walletInfo");
const netTextDom=document.getElementById("netText");

//切换主网
function setMainnet(){
    connection=new Connection(clusterApiUrl("mainnet-beta"),"confirmed");
    netTextDom.innerText="Mainnet 主网";
}
setMainnet();

function log(text){
    logBox.innerText+="> "+text+"\n";
    logBox.scrollTop=logBox.scrollHeight;
    console.log(text);
}

//连接钱包 Wallet‑Standard
connectBtn.onclick=async ()=>{
    log("正在检测Wallet‑Standard钱包");
    const wallets=await getWallets();
    if(wallets.length===0){
        log("❌未检测到Phantom/Backpack/Solflare钱包插件");
        return;
    }
    const w=wallets[0];
    try{
        await w.connect();
        selectedWallet=w;
        const acc=w.accounts[0];
        userPubKey=acc.publicKey;
        walletInfoDom.innerText=`✅已连接：${userPubKey.toBase58().slice(0,28)}...`;
        deployBtn.disabled=false;
        log("钱包连接成功");
    }catch(e){
        log("连接失败："+e.message);
    }
};

deployBtn.onclick=async ()=>{
    if(!selectedWallet||!userPubKey){log("❌请先连接钱包");return;}
    const name=document.getElementById("tkName").value.trim();
    const symbol=document.getElementById("tkSymbol").value.trim();
    const decimals=Number(document.getElementById("tkDecimals").value);
    const supplyStr=document.getElementById("tkSupply").value.trim();
    const revokeMint=document.getElementById("revokeMint").checked;
    const revokeFreeze=document.getElementById("revokeFreeze").checked;

    if(!name||!symbol||!supplyStr){log("❌名称、符号、供应量不能为空");return;}
    if(isNaN(decimals)||decimals<0||decimals>9){log("❌小数位必须0‑9");return;}
    if(!/^\d+$/.test(supplyStr)){log("❌供应量只能是纯数字");return;}

    deployBtn.disabled=true;
    log("开始创建Token‑2022 Mint账户");
    try{
        const mintKeypair=Keypair.generate();
        const mintPub=mintKeypair.publicKey;
        const supplyBig=BigInt(supplyStr)*(10n**BigInt(decimals));
        log(`Mint地址:${mintPub.toBase58()}`);
        log(`解析供应量:${supplyBig.toString()}`);

        //1 创建mint账户 Token‑2022
        const mintAuthority=revokeMint?null:userPubKey;
        const freezeAuthority=revokeFreeze?null:userPubKey;

        const mintSig=await createMint(
            connection,
            {
                signers:[mintKeypair],
                feePayer:userPubKey
            },
            decimals,
            mintAuthority,
            freezeAuthority,
            undefined,
            TOKEN_2022_PROGRAM_ID
        );
        log(`✅Mint账户已创建 tx:${mintSig}`);

        //2 初始化Token‑2022链上元数据
        const metaIx=createInitializeInstruction({
            programId:TOKEN_2022_PROGRAM_ID,
            mint:mintPub,
            updateAuthority:userPubKey,
            name:name,
            symbol:symbol,
            uri:""
        });
        const metaTx=new solanaWeb3.Transaction();
        metaTx.add(metaIx);
        const {blockhash}=await connection.getLatestBlockhash();
        metaTx.recentBlockhash=blockhash;
        metaTx.feePayer=userPubKey;
        const metaSig=await selectedWallet.signAndSendTransaction(metaTx);
        log(`✅元数据初始化 tx:${metaSig.signature}`);

        //3 构造ATA地址，铸造全部供应量到自己钱包
        const ataAddr=await getAssociatedTokenAddress(
            mintPub,
            userPubKey,
            false,
            TOKEN_2022_PROGRAM_ID
        );
        const {value:ataInfo}=await connection.getAccountInfo(ataAddr);
        if(!ataInfo){
            const createAtaIx=createAssociatedTokenAccountInstruction(
                userPubKey,
                ataAddr,
                userPubKey,
                mintPub,
                TOKEN_2022_PROGRAM_ID
            );
            const ataTx=new solanaWeb3.Transaction();
            ataTx.add(createAtaIx);
            ataTx.recentBlockhash=(await connection.getLatestBlockhash()).blockhash;
            ataTx.feePayer=userPubKey;
            await selectedWallet.signAndSendTransaction(ataTx);
            log("✅创建关联代币账户ATA完成");
        }

        //铸造指令
        const mintToIx=createMintToInstruction(
            mintPub,
            ataAddr,
            userPubKey,
            supplyBig,
            [],
            TOKEN_2022_PROGRAM_ID
        );
        const mintToTx=new solanaWeb3.Transaction();
        mintToTx.add(mintToIx);
        mintToTx.recentBlockhash=(await connection.getLatestBlockhash()).blockhash;
        mintToTx.feePayer=userPubKey;
        const mintToRes=await selectedWallet.signAndSendTransaction(mintToTx);
        log(`✅代币铸造完成 tx:${mintToRes.signature}`);

        const scanUrl=`https://solscan.io/token/${mintPub.toBase58()}`;
        log(`🎉全部完成！代币Mint地址：${mintPub.toBase58()}`);
        log(`🔗浏览器查看代币：${scanUrl}`);
    }catch(err){
        log("❌异常："+err.message);
    }finally{
        deployBtn.disabled=false;
    }
};
</script>
</body>
</html>
