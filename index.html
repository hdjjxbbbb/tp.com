        statusText.innerText="连接失败:"+e.message;
    }
};

// =====修复后的部署函数，解决TP假部署假合约地址bug=====
document.getElementById("deployBtn").onclick = async ()=>{
    if(!signer){
        statusText.innerText="请先连接钱包";
        return;
    }
    if(!BYTECODE){
        statusText.innerText="❌BYTECODE字节码为空！";
        return;
    }
    const name = document.getElementById("tokenName").value;
    const symbol = document.getElementById("tokenSymbol").value;
    const decimals = Number(document.getElementById("tokenDecimals").value);
    const supply = ethers.parseUnits(document.getElementById("totalSupply").value, decimals);

    statusText.innerText="正在组装部署数据，请在TP钱包确认签名交易";
    try {
        const factory = new ethers.ContractFactory(abi, BYTECODE, signer);
        // 构造部署calldata
        const deployCalldata = factory.getDeployTransaction(name, symbol, decimals, supply).data;
        // 手动发送部署交易
        const tx = await signer.sendTransaction({
            data: deployCalldata,
            to: null
        });
        statusText.innerText="交易已提交，TxHash："+tx.hash+" 等待链上确认...";
        //必须等待交易真正上链确认
        const receipt = await tx.wait();
        if(!receipt || receipt.status !==1){
            statusText.innerText="❌交易链上执行失败，合约没有部署！";
            return;
        }
        //从真实回执拿链上真实合约地址，不再本地模拟
        const realContractAddr = receipt.contractAddress;
        deployedContract = new ethers.Contract(realContractAddr, abi, signer);
        document.getElementById("targetContractAddr").value = realContractAddr;
        statusText.innerText="✅【真实部署成功】合约地址："+realContractAddr+"\n交易哈希:"+tx.hash;
    }catch(err){
        statusText.innerText="部署失败："+err.message.slice(0,150);
    }
};

document.getElementById("btnMint").onclick = async ()=>{
    if(!signer){
        statusText.innerText="请先连接管理员钱包！";
        return;
    }
    const currentAddr = await signer.getAddress();
    if(currentAddr.toLowerCase()!==SUPER_ADMIN.toLowerCase()){
        statusText.innerText="❌你不是超级管理员，无权增发";
        return;
    }
    const contractInputAddr = document.getElementById("targetContractAddr").value.trim();
    const mintToAddr = document.getElementById("mintTo").value.trim();
    const mintAmountStr = document.getElementById("mintNum").value.trim();
    if(!contractInputAddr){
        statusText.innerText="❌请填写要增发的代币合约地址";
        return;
    }
    if(!mintToAddr || !mintAmountStr){
        statusText.innerText="❌请填接收地址和增发数量";
        return;
    }
    statusText.innerText="正在读取链上合约，准备增发...";
    try{
        const targetContract = new ethers.Contract(contractInputAddr, abi, signer);
        const dec = await targetContract.decimals();
        const realAmount = ethers.parseUnits(mintAmountStr, Number(dec));
        const tx = await targetContract.mintMore(mintToAddr, realAmount);
        statusText.innerText="等待链上确认交易";
        await tx.wait();
        statusText.innerText="✅增发完成，交易已上链";
    }catch(e){
        statusText.innerText="增发失败:"+e.message.slice(0,120);
    }
};
