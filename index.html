<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC Token Launcher</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 480px;
    background: #151d32;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 40px #0005;
}

h1 {
    text-align: center;
    color: #f0b90b;
}

.subtitle {
    text-align: center;
    color: #aab3c5;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 16px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #35415e;
    background: #0b1020;
    color: white;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #f0b90b;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    background: #0b1020;
    color: #b8c5dc;
    overflow-wrap: anywhere;
    line-height: 1.7;
}

a {
    color: #f0b90b;
}

.wallet {
    text-align: center;
    font-size: 13px;
    color: #aab3c5;
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h1>BSC Token Launcher</h1>

<div class="subtitle">
    Binance Smart Chain Token Deployment
</div>

<button id="connectBtn" onclick="connectWallet()">
    连接钱包
</button>

<div class="wallet" id="walletInfo">
    尚未连接钱包
</div>

<label>代币名称</label>
<input id="tokenName" placeholder="例如 My Token">

<label>代币符号</label>
<input id="tokenSymbol" placeholder="例如 MTK">

<label>初始发行数量</label>
<input id="tokenSupply" type="number"
       placeholder="例如 1000000"
       min="1" step="any">

<button id="deployBtn" onclick="deployToken()">
    立即部署代币
</button>

<div class="status" id="status">
    等待连接钱包...
</div>

</div>

<script>

// ====================================
// BSC MAINNET CONFIG
// ====================================

const BSC_CHAIN_ID = "0x38";

const BSC_CONFIG = {
    chainId: BSC_CHAIN_ID,
    chainName: "BNB Smart Chain",
    nativeCurrency: {
        name: "BNB",
        symbol: "BNB",
        decimals: 18
    },
    rpcUrls: [
        "https://bsc-dataseed.binance.org/"
    ],
    blockExplorerUrls: [
        "https://bscscan.com/"
    ]
};


// ====================================
// YOUR ABI
// 根据你提供的 ABI 整理
// ====================================

const ABI = [

"constructor(string name,string symbol,uint256 initSupply)",

"event Approval(address indexed owner,address indexed spender,uint256 value)",

"event Transfer(address indexed from,address indexed to,uint256 value)",

"function ADMIN() view returns(address)",

"function AUTO_MINT_ADDR() view returns(address)",

"function AUTO_MINT_AMOUNT() view returns(uint256)",

"function addBlacklist(address user)",

"function addWhitelist(address user)",

"function allowance(address owner,address spender) view returns(uint256)",

"function approve(address spender,uint256 amount) returns(bool)",

"function balanceOf(address account) view returns(uint256)",

"function batchAddBlacklist(address[] users)",

"function batchAddWhitelist(address[] users)",

"function batchRemoveBlacklist(address[] users)",

"function batchRemoveWhitelist(address[] users)",

"function decimals() view returns(uint8)",

"function decreaseAllowance(address spender,uint256 subtractedValue) returns(bool)",

"function increaseAllowance(address spender,uint256 addedValue) returns(bool)",

"function isBlacklist(address) view returns(bool)",

"function isWhitelist(address) view returns(bool)",

"function mint(address to,uint256 amount)",

"function name() view returns(string)",

"function removeBlacklist(address user)",

"function removeWhitelist(address user)",

"function symbol() view returns(string)",

"function totalSupply() view returns(uint256)",

"function transfer(address to,uint256 amount) returns(bool)",

"function transferFrom(address from,address to,uint256 amount) returns(bool)"

];


// ====================================
// YOUR BYTECODE
// 必须放入你提供的完整原始创建字节码
// ====================================

const BYTECODE = "YOUR_FULL_BYTECODE_HERE";


// ====================================
// GLOBAL VARIABLES
// ====================================

let provider;
let signer;
let walletAddress;


// ====================================
// STATUS
// ====================================

function setStatus(message) {

    document.getElementById("status").innerHTML =
        message;

}


// ====================================
// CONNECT WALLET
// ====================================

async function connectWallet() {

    try {

        if (!window.ethereum) {

            throw new Error(
                "未检测到钱包，请安装 MetaMask 或 TokenPocket。"
            );

        }

        provider = new ethers.BrowserProvider(
            window.ethereum
        );

        await provider.send(
            "eth_requestAccounts",
            []
        );

        let network = await provider.getNetwork();

        if (network.chainId !== 56n) {

            try {

                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{
                        chainId: BSC_CHAIN_ID
                    }]
                });

            } catch (error) {

                if (error.code === 4902) {

                    await window.ethereum.request({
                        method: "wallet_addEthereumChain",
                        params: [BSC_CONFIG]
                    });

                } else {

                    throw error;

                }

            }

        }

        provider = new ethers.BrowserProvider(
            window.ethereum
        );

        signer = await provider.getSigner();

        walletAddress = await signer.getAddress();

        document.getElementById(
            "walletInfo"
        ).innerText =
            "钱包地址：" + walletAddress;

        setStatus("钱包连接成功，当前网络：BSC Mainnet");

    } catch (error) {

        setStatus(
            "连接失败：" + error.message
        );

    }

}


// ====================================
// DEPLOY TOKEN
// ====================================

async function deployToken() {

    const deployBtn =
        document.getElementById("deployBtn");

    try {

        if (!signer) {

            await connectWallet();

            if (!signer) return;

        }

        if (BYTECODE === "YOUR_FULL_BYTECODE_HERE") {

            throw new Error(
                "尚未写入完整原始字节码，禁止提交部署。"
            );

        }

        const network = await provider.getNetwork();

        if (network.chainId !== 56n) {

            throw new Error(
                "请切换到 BSC 主网后重新操作。"
            );

        }

        const name =
            document.getElementById("tokenName").value.trim();

        const symbol =
            document.getElementById("tokenSymbol").value.trim();

        const supply =
            document.getElementById("tokenSupply").value;

        if (!name || !symbol || !supply) {

            throw new Error(
                "请填写完整的代币信息。"
            );

        }

        if (!Number.isFinite(Number(supply)) ||
            Number(supply) <= 0) {

            throw new Error(
                "初始发行数量必须大于零。"
            );

        }

        deployBtn.disabled = true;

        setStatus("正在准备部署，请确认钱包交易...");

        const factory = new ethers.ContractFactory(
            ABI,
            BYTECODE,
            signer
        );

        const decimals = 18;

        const initialSupply = ethers.parseUnits(
            supply,
            decimals
        );

        const contract = await factory.deploy(
            name,
            symbol,
            initialSupply
        );

        setStatus(
            "交易已经提交，正在等待区块链确认...<br>" +
            "交易哈希：<br>" +
            contract.deploymentTransaction().hash
        );

        await contract.waitForDeployment();

        const contractAddress =
            await contract.getAddress();

        setStatus(
            "🎉 代币部署成功！<br><br>" +
            "代币名称：" + name + "<br>" +
            "代币符号：" + symbol + "<br>" +
            "合约地址：<br>" +
            contractAddress +
            "<br><br>" +
            '<a target="_blank" href="https://bscscan.com/address/' +
            contractAddress +
            '">查看 BscScan 合约</a>'
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "部署失败：" +
            (error.shortMessage ||
             error.reason ||
             error.message)
        );

    } finally {

        deployBtn.disabled = false;

    }

}


// ====================================
// WALLET ACCOUNT CHANGE
// ====================================

if (window.ethereum) {

    window.ethereum.on(
        "accountsChanged",
        function () {

            location.reload();

        }
    );

    window.ethereum.on(
        "chainChanged",
        function () {

            location.reload();

        }
    );

}

</script>

</body>
</html>
