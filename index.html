<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC Token Launcher</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 480px;
    background: #151d32;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 40px #0005;
}

h1 {
    text-align: center;
    color: #f0b90b;
}

.subtitle {
    text-align: center;
    color: #aab3c5;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 16px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #35415e;
    background: #0b1020;
    color: white;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #f0b90b;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    background: #0b1020;
    color: #b8c5dc;
    overflow-wrap: anywhere;
    line-height: 1.7;
}

a {
    color: #f0b90b;
}

.wallet {
    text-align: center;
    font-size: 13px;
    color: #aab3c5;
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h1>BSC Token Launcher</h1>

<div class="subtitle">
    Binance Smart Chain Token Deployment
</div>

<button id="connectBtn">
    连接钱包
</button>

<div class="wallet" id="walletInfo">
    尚未连接钱包
</div>

<label>代币名称</label>
<input id="tokenName" placeholder="例如 My Token">

<label>代币符号</label>
<input id="tokenSymbol" placeholder="例如 MTK">

<label>初始发行数量</label>
<!-- 关键改动：type="text"，只输入整数，不要填小数！ -->
<input id="tokenSupply" type="text"
       placeholder="只能填写正整数，例：1000000">

<button id="deployBtn" disabled>
    立即部署代币
</button>

<div class="status" id="status">
    等待连接钱包...
</div>

</div>

<script>

        decimals: 18
    },
    rpcUrls: [
        "https://bsc-dataseed.binance.org/"
    ],
    blockExplorerUrls: [
        "https://bscscan.com/"
    ]
};

{"inputs":[{"internalType":"address","name":"from","type":"address"},{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"transferFrom","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}

// ====================================
let provider = null;
let signer = null;
let walletAddr = null;

const connectBtn = document.getElementById("connectBtn");
const deployBtn = document.getElementById("deployBtn");
const walletInfoDom = document.getElementById("walletInfo");
const statusDom = document.getElementById("status");

function showStatus(text){
    statusDom.innerHTML = text;
}

// TP钱包兼容：循环等待window.ethereum注入
async function getEthereumObject(maxWaitMs = 2000){
    const step = 150;
    let waited = 0;
    while(!window.ethereum && waited < maxWaitMs){
        await new Promise(r=>setTimeout(r,step));
        waited += step;
    }
    return window.ethereum;
}

async function switchBSC(eth){
    try{
        await eth.request({method:"wallet_switchEthereumChain",params:[{chainId:BSC_CHAIN_ID}]});
    }catch(err){
        if(err.code === 4902){
            await eth.request({method:"wallet_addEthereumChain",params:[BSC_CONFIG]});
        }else{
            throw err;
        }
    }
}

// 连接钱包
connectBtn.onclick = async function(){
    showStatus("正在检测钱包环境...");
    const eth = await getEthereumObject();
    if(!eth){
        showStatus("❌未检测钱包对象，请在TP内置DApp浏览器打开！");
        return;
    }
    try{
        const accounts = await eth.request({method:"eth_requestAccounts"});
        if(!accounts || accounts.length===0){
            showStatus("用户拒绝授权");
            return;
        }
        await switchBSC(eth);
        provider = new ethers.BrowserProvider(eth);
        signer = await provider.getSigner();
        walletAddr = await signer.getAddress();
        walletInfoDom.innerText = "已连接："+walletAddr;
        deployBtn.disabled = false;
        showStatus("✅钱包连接成功");
    }catch(e){
        showStatus("连接失败："+(e.message||String(e)));
    }
};

// 部署
deployBtn.onclick = async function(){
    const name = document.getElementById("tokenName").value.trim();
    const symbol = document.getElementById("tokenSymbol").value.trim();
    const supplyRaw = document.getElementById("tokenSupply").value.trim();

    // 【重点】正则：只允许正整数，禁止小数点、0、负数
    if(!/^[1-9]\d*$/.test(supplyRaw)){
        showStatus("❌发行量只允许填写正整数，不能填小数、0、负数");
        return;
    }
    if(!name || !symbol){
        showStatus("❌请填写代币名称和符号");
        return;
    }
    if(!signer){
        showStatus("❌请先连接钱包");
        return;
    }
    if(!BYTECODE || !BYTECODE.startsWith("0x")){
        showStatus("❌Bytecode异常");
        return;
    }

    deployBtn.disabled = true;
    try{
        showStatus("正在准备部署参数...");
        // supplyRaw直接传字符串，不转Number，彻底规避浮点数bug
        const initSupply = ethers.parseUnits(supplyRaw, 18);
        const factory = new ethers.ContractFactory(ABI, BYTECODE, signer);
        showStatus("请在钱包确认部署交易，支付BNB Gas费");
        const contract = await factory.deploy(name, symbol, initSupply);
        const tx = contract.deploymentTransaction();
        showStatus(`交易已提交，hash：${tx.hash}\n等待区块确认`);
        await contract.waitForDeployment();
        const contractAddr = await contract.getAddress();
        showStatus(`✅部署成功！\n合约地址：${contractAddr}\nBscScan：https://bscscan.com/address/${contractAddr}`);
    }catch(err){
        showStatus("部署失败："+(err.shortMessage||err.message||String(err)));
    }finally{
        deployBtn.disabled = !signer;
    }
};

// 监听钱包切换
if(window.ethereum){
    window.ethereum.on("accountsChanged",()=>{
        provider=null;signer=null;walletAddr=null;
        walletInfoDom.innerText="尚未连接钱包";
        deployBtn.disabled=true;
        showStatus("钱包账户已切换，请重新点击连接钱包");
    });
    window.ethereum.on("chainChanged",()=>{
        location.reload();
    });
}
</script>
</body>
</html>
