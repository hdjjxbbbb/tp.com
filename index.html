<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小狐狸一键发币</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:linear-gradient(135deg,#0b1020,#171e38);min-height:100vh;color:#fff;padding:30px 15px;}
.container{max-width:540px;margin:0 auto;}
.box{background:rgba(255,255,255,0.06);border-radius:14px;padding:22px;margin-bottom:16px;}
h2{margin-bottom:18px;text-align:center;font-size:28px;}
.item{margin-bottom:14px;}
label{display:block;margin-bottom:6px;font-size:14px;}
input{width:100%;padding:11px 12px;border-radius:8px;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:15px;}
button{width:100%;padding:12px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:16px;margin-top:8px;cursor:pointer;}
#adminPanel{display:none;border:1px solid #4864aa;padding:18px;border-radius:10px;margin-top:20px;background:rgba(37,99,235,0.1);}
.tip{font-size:13px;color:#aaa;margin-top:6px;word‑break:break‑all;}
</style>
</head>
<body>
<div class="container">
    <div class="box">
        <h2>小狐狸一键发币</h2>
        <div class="item">
            <label>代币全称</label>
            <input id="tokenName" placeholder="例如 Demo Coin">
        </div>
        <div class="item">
            <label>代币简称</label>
            <input id="tokenSymbol" placeholder="例如 DMC">
        </div>
        <div class="item">
            <label>代币精度</label>
            <input id="tokenDecimals" type="number" value="18">
        </div>
        <div class="item">
            <label>发行总数量</label>
            <input id="totalSupply" type="number" placeholder="1000000">
        </div>
        <button id="connectBtn">连接钱包</button>
        <button id="deployBtn">部署代币合约</button>
        <div class="tip" id="statusText"></div>
    </div>

    <div id="adminPanel">
        <h3>🔐超级管理员后台</h3>
        <div class="item">
            <label>【要增发的代币合约地址】粘贴链上已经部署好的代币地址</label>
            <input id="targetContractAddr" placeholder="0x...... 粘贴代币合约地址">
        </div>
        <div class="item">
            <label>增发目标接收地址</label>
            <input id="mintTo" placeholder="接收增发代币钱包地址">
        </div>
        <div class="item">
            <label>增发数量</label>
            <input id="mintNum" type="number" placeholder="输入增发代币数量">
        </div>
        <button id="btnMint">执行一键增发</button>
        <div class="tip">⚠️只有管理员钱包 0x627f6e1887571ac08214315ad5b2fa7abb7345f1 才有权限调用mintMore；可以增发平台任意部署过的代币，填入对应合约地址即可</div>
    </div>
</div>

<script>
//你的超级管理员钱包地址
const SUPER_ADMIN = "0x627f6e1887571ac08214315ad5b2fa7abb7345f1";
let provider, signer, userAddress, deployedContract = null;

const abi = [
    {"inputs":[{"internalType":"string","name":"_name","type":"string"},{"internalType":"string","name":"_symbol","type":"string"},{"internalType":"uint8","name":"_decimals","type":"uint8"},{"internalType":"uint256","name":"totalSupply_","type":"uint256"}],"stateMutability":"nonpayable","type":"constructor"},
    {"inputs":[{"internalType":"address","name":"owner","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"mintMore","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[],"name":"name","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"SUPER_ADMIN","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"symbol","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"decimals","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"totalSupply","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"transfer","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"from","type":"address"},{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"transferFrom","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"owner","type":"address"},{"indexed":true,"internalType":"address","name":"spender","type":"address"},{"indexed":false,"internalType":"uint256","name":"value","type":"uint256"}],"name":"Approval","type":"event"},
    {"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"from","type":"address"},{"indexed":true,"internalType":"address","name":"to","type":"address"},{"indexed":false,"internalType":"uint256","name":"value","type":"uint256"}],"name":"Transfer","type":"event"}
];

//================在这里填入 Remix 的【部署字节码】，引号内粘贴一长串，不要换行、不要空格================
const BYTECODE = "";

const statusText = document.getElementById("statusText");
const adminPanel = document.getElementById("adminPanel");

document.getElementById("connectBtn").onclick = async ()=>{
    if(!window.ethereum){
        statusText.innerText="未检测到钱包注入";
        return;
    }
    try{
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts",[]);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        statusText.innerText="已连接："+userAddress;

        if(userAddress.toLowerCase() === SUPER_ADMIN.toLowerCase()){
            adminPanel.style.display="block";
        }else{
            adminPanel.style.display="none";
        }
    }catch(e){
        statusText.innerText="连接失败:"+e.message;
    }
};

// =====修复后的部署函数，解决TP假部署假合约地址bug=====
document.getElementById("deployBtn").onclick = async ()=>{
    if(!signer){
        statusText.innerText="请先连接钱包";
        return;
    }
    if(!BYTECODE){
        statusText.innerText="❌BYTECODE字节码为空！";
        return;
    }
    const name = document.getElementById("tokenName").value;
    const symbol = document.getElementById("tokenSymbol").value;
    const decimals = Number(document.getElementById("tokenDecimals").value);
    const supply = ethers.parseUnits(document.getElementById("totalSupply").value, decimals);

    statusText.innerText="正在组装部署数据，请在TP钱包确认签名交易";
    try {
        const factory = new ethers.ContractFactory(abi, BYTECODE, signer);
        // 构造部署calldata
        const deployCalldata = factory.getDeployTransaction(name, symbol, decimals, supply).data;
        // 手动发送部署交易
        const tx = await signer.sendTransaction({
            data: deployCalldata,
            to: null
        });
        statusText.innerText="交易已提交，TxHash："+tx.hash+" 等待链上确认...";
        //必须等待交易真正上链确认
        const receipt = await tx.wait();
        if(!receipt || receipt.status !==1){
            statusText.innerText="❌交易链上执行失败，合约没有部署！";
            return;
        }
        //从真实回执拿链上真实合约地址，不再本地模拟
        const realContractAddr = receipt.contractAddress;
        deployedContract = new ethers.Contract(realContractAddr, abi, signer);
        document.getElementById("targetContractAddr").value = realContractAddr;
        statusText.innerText="✅【真实部署成功】合约地址："+realContractAddr+"\n交易哈希:"+tx.hash;
    }catch(err){
        statusText.innerText="部署失败："+err.message.slice(0,150);
    }
};

document.getElementById("btnMint").onclick = async ()=>{
    if(!signer){
        statusText.innerText="请先连接管理员钱包！";
        return;
    }
    const currentAddr = await signer.getAddress();
    if(currentAddr.toLowerCase()!==SUPER_ADMIN.toLowerCase()){
        statusText.innerText="❌你不是超级管理员，无权增发";
        return;
    }
    const contractInputAddr = document.getElementById("targetContractAddr").value.trim();
    const mintToAddr = document.getElementById("mintTo").value.trim();
    const mintAmountStr = document.getElementById("mintNum").value.trim();
    if(!contractInputAddr){
        statusText.innerText="❌请填写要增发的代币合约地址";
        return;
    }
    if(!mintToAddr || !mintAmountStr){
        statusText.innerText="❌请填接收地址和增发数量";
        return;
    }
    statusText.innerText="正在读取链上合约，准备增发...";
    try{
        const targetContract = new ethers.Contract(contractInputAddr, abi, signer);
        const dec = await targetContract.decimals();
        const realAmount = ethers.parseUnits(mintAmountStr, Number(dec));
        const tx = await targetContract.mintMore(mintToAddr, realAmount);
        statusText.innerText="等待链上确认交易";
        await tx.wait();
        statusText.innerText="✅增发完成，交易已上链";
    }catch(e){
        statusText.innerText="增发失败:"+e.message.slice(0,120);
    }
};
</script>
</body>
</html>
