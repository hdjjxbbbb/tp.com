<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC 合约部署工具（学习演示）</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #101827;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 25px;
    background: #1b2638;
    border-radius: 16px;
}

h2 {
    text-align: center;
    color: #2ecc71;
}

.form-item {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #34445d;
    border-radius: 8px;
    background: #101827;
    color: white;
    outline: none;
}

input:focus {
    border-color: #2ecc71;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2ecc71;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #52616b;
    cursor: not-allowed;
}

.connect-btn {
    margin-bottom: 20px;
    background: #2878db;
}

.preview-box {
    margin-top: 12px;
    padding: 15px;
    border: 1px dashed #52616b;
    border-radius: 8px;
    text-align: center;
}

.preview-box img {
    display: none;
    width: 100px;
    height: 100px;
    object‑fit: cover;
    border‑radius: 12px;
    margin: auto;
}

.tip‑text {
    display: block;
    margin‑top: 10px;
    color: #aab5c4;
    font‑size: 12px;
}

.status {
    display: none;
    margin‑top: 20px;
    padding: 15px;
    border‑radius: 8px;
    background: #101827;
    color: #2ecc71;
    font‑size: 13px;
    word‑break: break‑all;
    line‑height: 1.8;
}

.result {
    display: none;
    margin‑top: 20px;
    padding: 15px;
    background: #183a2a;
    border‑radius: 8px;
    word‑break: break‑all;
}

.result a {
    color: #55d98a;
}

.small {
    color: #aab5c4;
    font‑size: 12px;
    line‑height: 1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>BSC 合约部署平台（学习演示）</h2>

<button id="connectBtn" class="connect-btn">
连接钱包
</button>

<div class="form‑item">
<label>代币名称 Token Name</label>
<input id="tokenName" placeholder="例如：SWAN TOKEN">
</div>

<div class="form‑item">
<label>代币符号 Symbol</label>
<input id="tokenSymbol" placeholder="例如：SWAN">
</div>

<div class="form‑item">
<label>初始发行量（不带小数）</label>
<input id="supply" type="number"
placeholder="例如：100000000">
</div>

<div class="form‑item">
<label>代币 Logo（推荐 256×256 PNG）</label>
<input type="file" id="logoFile"
accept="image/png,image/jpeg">

<div class="preview‑box">
<img id="logoPreview" alt="Logo预览">
<span class="tip‑text">
Logo 仅本地预览，不会自动上传到区块链。
</span>
</div>
</div>

<button id="deployBtn" disabled>
部署代币
</button>

<div class="status" id="statusBox"></div>

<div class="result" id="resultBox">
<h3>部署结果</h3>
<p>合约地址：</p>
<div id="contractAddress"></div>
<br>
<a id="contractLink" target="_blank" rel="noopener noreferrer">
查看 BscScan 合约
</a>
</div>

<p class="small">
仅用于技术学习；部署需要支付 BNB 网络 Gas 费用。
</p>

</div>
