<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天鹅一键发币</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:25px 15px;
 background:linear-gradient(135deg,#0b1020,#171e38);
 color:white;
 font-family:Arial,"Microsoft Yahei",sans-serif;
}
.container{max-width:500px;margin:auto}
h1{text-align:center;color:#f7c04a}
.card{
 background:#ffffff0c;
 border:1px solid #ffffff20;
 border-radius:15px;
 padding:24px;
 margin-top:25px;
}
label{display:block;margin:18px 0 8px;color:#d0d8f0}
input{
 width:100%;
 padding:14px;
 border-radius:9px;
 border:1px solid #353f64;
 background:#141b33;
 color:white;
 font-size:16px;
}
button{
 width:100%;
 padding:15px;
 margin-top:16px;
 border:0;
 border-radius:9px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
.connect{background:#3b63e9;color:white}
.deploy{background:#f7c04a;color:#111}
button:disabled{opacity:.5;cursor:not-allowed;}
.status{
 margin-top:18px;
 padding:14px;
 background:#202944;
 border-radius:9px;
 word-break:break-all;
 line-height:1.7;
}
#preview{
 width:70px;
 height:70px;
 border-radius:50%;
 object-fit:cover;
 display:none;
 margin-top:12px;
}
</style>
</head>
<body>
<div class="container">
<h1>🦢 天鹅一键发币</h1>
<div class="card">
<button class="connect" id="connectBtn">
连接 MetaMask / TP钱包
</button>
<div id="walletInfo"></div>
<label>代币全称 Name</label>
<input id="tokenName" placeholder="例如 Swan Coin">
<label>代币符号 Symbol</label>
<input id="tokenSymbol" placeholder="例如 SWAN">
<label>初始发行量（不带小数）</label>
<input id="supply" type="number"
placeholder="例如 100000000">
<label>代币 Logo</label>
<input id="logo" type="file" accept="image/*">
<img id="preview">
<button class="deploy" id="deployBtn" disabled>
一键部署代币
</button>
<div class="status" id="status">
请先连接钱包。
</div>
</div>
</div>
<!-- 注意：改回普通script，不使用type="module"，解决MetaMask插件注入时序bug -->
<script src="https://esm.sh/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<script src="https://esm.sh/solc@0.8.20/dist/solc.min.js"></script>
<script>
const CHAIN_ID = 1;
const HEX_CHAIN_ID = "0x1";
const CHAIN_CONFIG = {
    chainId:HEX_CHAIN_ID,
    chainName:"Ethereum Mainnet",
    rpcUrls:["https://mainnet.infura.io/v3"],
    blockExplorerUrls:["https://etherscan.io"],
    nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18}
};

let provider;
let signer;
let walletAddress;
const $ = id => document.getElementById(id);

function status(message){
 $("status").innerHTML = message;
 console.log("[状态]",message);
}

// 获取provider，优先TP，fallback MetaMask window.ethereum
function getProvider(){
    if(window.tokenpocket?.ethereum){
        return window.tokenpocket.ethereum;
    }
    if(window.ethereum){
        return window.ethereum;
    }
    return null;
}

// 网络切换逻辑
async function switchChain(ethProvider){
    try{
        await ethProvider.request({method:"wallet_switchEthereumChain", params:[{chainId:HEX_CHAIN_ID}]});
        return true;
    }catch(err){
        console.warn("切换链失败",err);
        // 用户拒绝切换 / 链不存在，尝试添加网络
        try{
            await ethProvider.request({method:"wallet_addEthereumChain", params:[CHAIN_CONFIG]});
            return true;
        }catch(e){
            status("⚠️无法自动切换网络，请手动在钱包切换到以太坊主网(ChainId:1)");
            return false;
        }
    }
}

$("logo").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=event=>{
  $("preview").src=event.target.result;
  $("preview").style.display="block";
 };
 reader.readAsDataURL(file);
});

//纯净无后门ERC20合约源码
const source = `
// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;
contract SwanToken {
    string public name;
    string public symbol;
    uint8 public constant decimals = 18;
    uint256 public totalSupply;
    mapping(address => uint256) public balanceOf;
    mapping(address => mapping(address => uint256))
        public allowance;
    event Transfer(
        address indexed from,
        address indexed to,
        uint256 value
    );
    event Approval(
        address indexed owner,
        address indexed spender,
        uint256 value
    );
    constructor(
        string memory tokenName,
        string memory tokenSymbol,
        uint256 initialSupply
    ) {
        name = tokenName;
        symbol = tokenSymbol;
        totalSupply = initialSupply;
        balanceOf[msg.sender] = initialSupply;
        emit Transfer(
            address(0),
            msg.sender,
            initialSupply
        );
    }
    function transfer(
        address to,
        uint256 amount
    ) external returns (bool) {
        require(to != address(0), "Invalid address");
        require(balanceOf[msg.sender] >= amount, "Insufficient balance");
        balanceOf[msg.sender] -= amount;
        balanceOf[to] += amount;
        emit Transfer(msg.sender, to, amount);
        return true;
    }
    function approve(
        address spender,
        uint256 amount
    ) external returns (bool) {
        allowance[msg.sender][spender] = amount;
        emit Approval(msg.sender, spender, amount);
        return true;
    }
    function transferFrom(
        address from,
        address to,
        uint256 amount
    ) external returns (bool) {
        require(to != address(0), "Invalid address");
        require(balanceOf[from] >= amount, "Insufficient balance");
        uint256 allowed = allowance[from][msg.sender];
        require(allowed >= amount, "Insufficient allowance");
        if (allowed != type(uint256).max) {
            allowance[from][msg.sender] = allowed - amount;
        }
        balanceOf[from] -= amount;
        balanceOf[to] += amount;
        emit Transfer(from, to, amount);
        return true;
    }
}
`;

async function compileContract(){
 status("正在编译 ERC20 智能合约，请稍候...");
 const input={
  language:"Solidity",
  sources:{
   "SwanToken.sol":{
    content:source
   }
  },
  settings:{
   optimizer:{
    enabled:true,
    runs:200
   },
   outputSelection:{
    "*":{
     "*":["abi","evm.bytecode.object"]
    }
   }
  }
 };
 const output=JSON.parse(solc.compile(JSON.stringify(input)));
 const errors=output.errors || [];
 const fatal=errors.filter(
  e=>e.severity==="error"
 );
 if(fatal.length){
  throw new Error(
   fatal.map(e=>e.formattedMessage).join("\n")
  );
 }
 const contract=output.contracts["SwanToken.sol"]["SwanToken"];
 if(!contract.evm.bytecode.object){
  throw new Error("合约编译失败");
 }
 return {
  abi:contract.abi,
  bytecode:"0x"+contract.evm.bytecode.object
 };
}

// 钱包连接主逻辑
$("connectBtn").onclick=async()=>{
    try{
        $("connectBtn").disabled=true;
        status("正在检测钱包...");

        // 循环等待钱包provider注入（TP移动端延迟注入兼容）
        let eth = null;
        let retryTimes = 0;
        while (!eth && retryTimes < 12) {
            eth = getProvider();
            if(eth) break;
            await new Promise(r => setTimeout(r, 120));
            retryTimes++;
        }

        if(!eth){
            throw new Error("未检测到钱包扩展，请确认MetaMask已安装或在TP内置浏览器打开");
        }
        console.log("检测到钱包provider",eth);

        // 第一步原生调用唤起授权弹窗（关键！顺序不能调换）
        const accounts = await eth.request({ method:"eth_requestAccounts" });
        if(!accounts || accounts.length ===0){
            throw new Error("用户取消钱包连接");
        }

        // 第二步初始化ethers6 BrowserProvider
        provider = new ethers.BrowserProvider(eth);
        await switchChain(eth);
        signer = await provider.getSigner();
        walletAddress = await signer.getAddress();

        $("walletInfo").innerHTML = `<p style='color:#66ff99'>钱包已连接：${walletAddress}</p>`;
        $("connectBtn").innerText = "钱包已连接";
        $("deployBtn").disabled = false;
        status("✅钱包连接成功，可以创建代币。");

    }catch(err){
        console.error("连接异常",err);
        // 4001 用户拒绝签名/授权
        if(err.code === 4001){
            status("❌用户拒绝钱包授权，请重新点击连接");
        }else{
            status("连接失败："+(err.message||String(err)));
        }
    }finally{
        $("connectBtn").disabled = false;
    }
};

$("deployBtn").onclick=async()=>{
 try{
  if(!signer){
   throw new Error("请先连接钱包");
  }
  const name=$("tokenName").value.trim();
  const symbol=$("tokenSymbol").value.trim();
  const supply=$("supply").value.trim();
  if(!name || !symbol || !supply){
   throw new Error("请填写完整代币信息");
  }
  if(name.length>64 || symbol.length>16){
   throw new Error("代币名称或符号过长");
  }
  if(!/^[1-9][0-9]*$/.test(supply)){
   throw new Error("发行量必须是正整数");
  }
  if(supply.length>30){
   throw new Error("发行量超出允许范围");
  }
  if(!window.confirm(
   "请确认代币信息：\n"+
   "名称："+name+"\n"+
   "符号："+symbol+"\n"+
   "发行量："+supply+"\n"+
   "网络：Ethereum Mainnet\n\n"+
   "确认开始部署？"
  )){
   return;
  }
  $("deployBtn").disabled=true;
  const compiled=await compileContract();
  status("合约编译成功，正在创建部署交易...");
  const initialSupply=ethers.parseUnits(supply,18);
  const factory=new ethers.ContractFactory(
   compiled.abi,
   compiled.bytecode,
   signer
  );
  const contract=await factory.deploy(
   name,
   symbol,
   initialSupply
  );
  status(
   "部署交易已提交。<br>"+
   "交易哈希：<br>"+
   contract.deploymentTransaction().hash
  );
  await contract.waitForDeployment();
  const address=await contract.getAddress();
  status(
   "🎉 代币部署成功！<br><br>"+
   "代币名称："+name+"<br>"+
   "代币符号："+symbol+"<br>"+
   "发行量："+supply+"<br>"+
   "小数位：18<br><br>"+
   "合约地址：<br>"+address+
   "<br><br>"+
   '<a style="color:#f7c04a" target="_blank" href="https://etherscan.io/address/'+address+'">查看 Etherscan 合约</a>'+
   "<br><br>"+
   '<a style="color:#66ff99" target="_blank" href="https://etherscan.io/tx/'+contract.deploymentTransaction().hash+'">查看部署交易</a>'
  );
 }catch(error){
  console.error(error);
  status("部署失败："+(error.shortMessage||error.message));
 }finally{
  $("deployBtn").disabled=false;
 }
};
</script>
</body>
</html>
