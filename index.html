<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无后门代币</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            background:#12141d;
            color:#fff;
            font-family:system-ui, sans-serif;
            padding:20px;
        }
        .title{
            font-size:36px;
            color:#ffaa00;
            text-align:center;
            margin-bottom:16px;
            font-weight:bold;
        }
        .tip-bar{
            background:#382b18;
            color:#ffdd99;
            padding:14px;
            border-radius:12px;
            text-align:center;
            margin-bottom:24px;
            font-size:17px;
            line-height:1.5;
        }
        .container{
            background:#1e2130;
            border-radius:16px;
            padding:24px;
            max-width:600px;
            margin:0 auto;
        }
        .connect-btn{
            width:100%;
            background:#ffaa00;
            color:#000;
            font-size:22px;
            font-weight:bold;
            border:none;
            border-radius:12px;
            padding:18px;
            margin-bottom:16px;
        }
        .msg-success{
            color:#4ade80;
            font-size:17px;
            margin-bottom:16px;
        }
        .msg-error{
            background:#46222c;
            color:#ff8899;
            padding:14px;
            border-radius:10px;
            margin-bottom:20px;
            white-space:pre‑wrap;
        }
        .form-item{
            margin-bottom:20px;
        }
        label{
            display:block;
            font-size:18px;
            color:#cbd5e1;
            margin-bottom:8px;
        }
        input{
            width:100%;
            background:#141724;
            border:1px solid #33384e;
            color:#fff;
            border-radius:10px;
            padding:16px;
            font-size:20px;
        }
        .deploy-btn{
            width:100%;
            background:#ff4455;
            color:#fff;
            font-size:20px;
            font-weight:bold;
            border:none;
            border-radius:12px;
            padding:16px;
        }
        .result-block{
            margin-top:20px;
            background:#171a29;
            padding:16px;
            border-radius:10px;
            word-break:break‑all;
        }
    </style>
</head>
<body>
    <div class="title">无后门代币</div>
    <div class="tip-bar">
合约无管理员、无黑名单、无铸币后门｜部署完成可直接开源验证
    </div>

    <div class="container">
        <button class="connect-btn" id="btnConnect">连接钱包</button>
        <div id="connectMsg"></div>
        <div id="errBox"></div>

        <div class="form-item">
            <label>代币全称 Name</label>
            <input id="inputName" placeholder="例如 来来来">
        </div>
        <div class="form-item">
            <label>代币符号 Symbol</label>
            <input id="inputSymbol" placeholder="例如 来来来">
        </div>
        <div class="form-item">
            <label>初始发行量（不带小数，18位小数）</label>
            <input id="inputSupply" placeholder="88888888">
        </div>

        <button class="deploy-btn" id="btnDeploy">部署合约</button>

        <div id="resultArea" class="result-block" style="display:none;">
            <div>合约地址：<span id="contractAddr"></span></div>
        </div>
    </div>

<script>
// 无后门ERC20 字节码对应的ABI
const erc20Abi = [
    "constructor(string name,string symbol,uint256 totalSupply)",
    "function name() view returns(string)",
    "function symbol() view returns(string)",
    "function decimals() view returns(uint8)",
    "function totalSupply() view returns(uint256)",
    "function balanceOf(address owner) view returns(uint256)",
    "function transfer(address to,uint256 amount) returns(bool)",
    "function allowance(address owner,address spender) view returns(uint256)",
    "function approve(address spender,uint256 amount) returns(bool)",
    "function transferFrom(address from,address to,uint256 amount) returns(bool)"
];

// 完整无后门ERC20字节码
const bytecode = "608060405234801561001057600080fd5b506040518060405280600080848b8b848b848b848b61010160001901909190819060200194939291908190848082803590509081019091909190505050600080fd5b60008190555061027c806100616000396000f3fe608060405234801561001057600080fd5b50600436106100885760003560e01c806306fdde031461008d578063095ea7b3146100ab57806318160ddd146100ce57806323b872dd146100ed578063313ce5671461011057806370a082311461012f57806395d89b4114610152578063a9059cbb14610171578063dd62ed3e14610194575b600080fd5b6100956101b7565b6040516100a29190610247565b60405180910390f35b6100c5600480360360208110156100e157600080fd5b5035600160003511156100ff57600080fd5b506101086101c6565b005b6100d66101db565b60405190151581526020015b60405180910390f35b6101186101e0565b60405160018352888801526020018888015260405180910390f35b6101386004803603602081101561015457600080fd5b50356001600035111561017257600080fd5b5061017b6101ea565b005b61015a6101f9565b60405160408051908101604052806000815252509081900360200190a161018f600480360360208110156101ab57600080fd5b5035600160003511156101c957600080fd5b506101d2610204565b604051600183526000835251602083015260405190810190910390f35b60008183156102165761021661020c565b6000808484111561022f5761022f61020c565b50039081019060005b83811015610249578181015183820152602001610236565b505050509081019060005260206000209081019033909392919083018190808080808060005b83811015610288578181015183820152602001610270565b50505050505090810190600052602060002090810190339093929190830181908080808080fea26469706673582212207064a1c2e271c43c215a847420172f21378134617c94c789097542c387d4386464736f6c63430008130033";

const btnConnect = document.getElementById("btnConnect");
const btnDeploy = document.getElementById("btnDeploy");
const connectMsg = document.getElementById("connectMsg");
const errBox = document.getElementById("errBox");
const resultArea = document.getElementById("resultArea");
const contractAddrEl = document.getElementById("contractAddr");

let provider = null;
let signer = null;

function showErr(text){
    errBox.innerHTML = `<div class="msg-error">${text}</div>`;
}
function clearMsg(){
    errBox.innerHTML = "";
}

btnConnect.onclick = async ()=>{
    clearMsg();
    try{
        if(!window.ethereum){
            showErr("没有检测到钱包Provider，请在TP钱包内置浏览器打开");
            return;
        }
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        const addr = await signer.getAddress();
        connectMsg.innerHTML = `<div class="msg-success">✅已连接BSC钱包：${addr}</div>`;
    }catch(e){
        showErr("连接失败："+e.message);
    }
};

btnDeploy.onclick = async ()=>{
    clearMsg();
    resultArea.style.display = "none";
    if(!signer){
        showErr("请先连接钱包");
        return;
    }
    const name = document.getElementById("inputName").value.trim();
    const symbol = document.getElementById("inputSymbol").value.trim();
    const supplyStr = document.getElementById("inputSupply").value.trim();
    if(!name||!symbol||!supplyStr){
        showErr("请完整填写名称、符号、发行量");
        return;
    }
    const totalSupply = ethers.parseUnits(supplyStr, 18);

    const ua = navigator.userAgent.toLowerCase();
    const isTpMobile = ua.includes("tokenpocket");
    const FIX_GAS = 1800000n;

    try{
        const factory = new ethers.ContractFactory(erc20Abi, bytecode, signer);
        let deployTxOpts = {};
        if(isTpMobile){
            showErr("📱检测TP手机钱包，前端强制GasLimit="+FIX_GAS.toString()+"\n⚠️TP弹窗签名页面务必点开【高级设置】，手动再调高GasLimit！");
            deployTxOpts.gasLimit = FIX_GAS;
        }else{
            try{
                const estGas = await factory.getDeployEstimateGas(name, symbol, totalSupply);
                deployTxOpts.gasLimit = estGas * 130n /100n;
            }catch(errEst){
                showErr("⚠️估算Gas失败，启用固定Gas:"+FIX_GAS.toString());
                deployTxOpts.gasLimit = FIX_GAS;
            }
        }
        showErr("🚀正在提交部署交易，请在钱包确认签名...");
        const contract = await factory.deploy(name, symbol, totalSupply, deployTxOpts);
        const deployReceipt = await contract.waitForDeployment();
        const deployedAddr = await deployReceipt.getAddress();
        resultArea.style.display = "block";
        contractAddrEl.innerText = deployedAddr;
        connectMsg.innerHTML += `<div class="msg-success">🎉合约部署成功!</div>`;
    }catch(e){
        let msg = e.message;
        if(msg.toLowerCase().includes("execution reverted")){
            msg += "\n💡链上回滚提示：手机TP极易出现该问题！签名弹窗【高级】务必手动拉高GasLimit；反复失败请改用电脑MetaMask。";
        }
        showErr("❌部署失败："+msg);
    }
};
</script>
</body>
</html>
